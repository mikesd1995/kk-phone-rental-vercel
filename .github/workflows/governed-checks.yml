name: KK Governed Checks

on:
  pull_request:
    branches:
      - main
      - skills/x-scanner-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Syntax and governed regression checks
        run: npm run check
