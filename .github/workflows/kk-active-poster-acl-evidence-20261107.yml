name: KK Active Poster ACL Evidence — isolated read-only

on:
  pull_request:
    paths:
      - 'evidence/kk-active-poster-acl-snapshot-20261107.json'
      - 'scripts/qa/kk-active-poster-acl-evidence-20261107.cjs'
      - 'tests/kk-active-poster-acl-evidence-20261107.test.js'
      - 'docs/KK_ACTIVE_POSTER_ACL_46_FILE_AUDIT_20261107.md'
      - '.github/workflows/kk-active-poster-acl-evidence-20261107.yml'

permissions:
  contents: read

concurrency:
  group: kk-poster-acl-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  isolated-evidence-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Source and regression tests (no network or credentials)
        run: |
          node --check scripts/qa/kk-active-poster-acl-evidence-20261107.cjs
          node --test tests/kk-active-poster-acl-evidence-20261107.test.js

      - name: Read-only report — must explicitly show unresolved P0
        run: |
          node scripts/qa/kk-active-poster-acl-evidence-20261107.cjs --report > /tmp/kk-acl-evidence-summary.json
          node - <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('/tmp/kk-acl-evidence-summary.json','utf8'));
          if(a.result!=='P0_BLOCKED'||a.counts.writer!==45||a.distinct_google_drive_posters!==46||
             a.release_authorized!==false||a.production_acl_changed!==false)
            throw new Error('P0_ACL_EVIDENCE_ASSERTION_MISMATCH');
          console.log('PASS evidence-only; real Google Drive ACL still has 45 public writers; NO release approval.');
          NODE

      - name: Prove zero-writer release guard blocks current risky evidence
        run: |
          set +e
          node scripts/qa/kk-active-poster-acl-evidence-20261107.cjs --assert-zero-public-writer >/tmp/kk-acl-blocked.json
          status=$?
          set -e
          test "$status" -eq 2
          echo "PASS: release assertion correctly refused 45 remaining public Writer roles."
