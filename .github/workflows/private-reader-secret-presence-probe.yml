name: TEMP Private Reader Secret Presence Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/private-reader-secret-presence-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON_PRESENT"
            exit 0
          fi
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}" ] && [ -n "${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_PAIR_PRESENT"
            exit 0
          fi
          echo "GOOGLE_SERVICE_ACCOUNT_SECRET_MISSING"
