name: KK Poster ACL Offline Security Regression
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ops/drive-security/kk-poster-acl-owner-review-20261013.gs'
      - 'ops/drive-security/kk-poster-acl-READONLY-preflight-20261014.gs'
      - 'ops/drive-security/kk-poster-acl-owner-review-20261013.test.cjs'
      - 'docs/KK_POSTER_ACL_20261017_RECONCILIATION.md'
      - '.github/workflows/kk-poster-acl-offline.yml'

permissions:
  contents: read

concurrency:
  group: kk-poster-acl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PINNED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout immutable PR head without persisted token
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PINNED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require exact source SHA and zero-install
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PINNED_SHA"
          test ! -f package-lock.json
          test ! -f npm-shrinkwrap.json
          echo "Offline only; do not install, send provider requests, or mutate ACL."
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run owner-gated poster ACL mock regression
        run: |
          node --check ops/drive-security/kk-poster-acl-owner-review-20261013.test.cjs
          node --test ops/drive-security/kk-poster-acl-owner-review-20261013.test.cjs
