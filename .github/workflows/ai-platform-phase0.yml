name: AI Platform Phase 0

on:
  pull_request:
    branches: [main, agent-platform-hardening-v1-20260922, ai-platform-phase0-integration-20260923, ai-platform-phase1-readonly-20260924]
  push:
    branches: [ai-platform-phase0-control-plane]

permissions:
  contents: read

concurrency:
  group: ai-platform-phase0-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  existing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: npm run check
      - run: npm test
      - name: Existing advisory-provider safety harnesses
        env:
          HF_EVENT_ASSIST_ENABLED: 'false'
        run: |
          node scripts/hf-event-assist-benchmark.js > /tmp/phase0-hf-benchmark.json
          node scripts/hf-event-assist-readiness.js > /tmp/phase0-hf-readiness.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('/tmp/phase0-hf-benchmark.json'));const r=JSON.parse(fs.readFileSync('/tmp/phase0-hf-readiness.json'));if(b.status!=='PREPARED_NOT_EXECUTED'||b.live_hf_calls!==0||b.production_writes!==0||b.final_truth_mutation!==false||b.notification_sends!==0||r.status!=='BLOCKED'||r.network_calls!==0||r.production_writes!==0||r.final_truth_mutation!==false||r.notification_sends!==0||!r.blockers.includes('HF_EVENT_ASSIST_DISABLED'))process.exit(1)"
  isolated-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24.13.1'
      - name: Verify exact source identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: npm run check:platform
      - run: npm run test:platform
