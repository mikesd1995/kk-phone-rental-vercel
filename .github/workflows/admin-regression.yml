name: Admin Regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Syntax checks
        run: npm run check

      - name: Regression tests
        run: npm test

      - name: Continuous invariant gate
        run: npm run audit:invariants

      - name: Code Intelligence retrieval benchmark
        run: npm run code:benchmark

      - name: HF benchmark harness safety check
        env:
          HF_EVENT_ASSIST_ENABLED: 'false'
        run: |
          node scripts/hf-event-assist-benchmark.js > /tmp/hf-benchmark.json
          cat /tmp/hf-benchmark.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/hf-benchmark.json','utf8'));if(r.status!=='PREPARED_NOT_EXECUTED'||r.live_hf_calls!==0||r.production_writes!==0||r.final_truth_mutation!==false||r.notification_sends!==0){console.error(r);process.exit(1)}"

      - name: HF readiness stays fail-closed without activation
        env:
          HF_EVENT_ASSIST_ENABLED: 'false'
        run: |
          node scripts/hf-event-assist-readiness.js > /tmp/hf-readiness.json
          cat /tmp/hf-readiness.json
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync('/tmp/hf-readiness.json','utf8'));if(r.status!=='BLOCKED'||r.network_calls!==0||r.production_writes!==0||r.final_truth_mutation!==false||r.notification_sends!==0||!r.blockers.includes('HF_EVENT_ASSIST_DISABLED')){console.error(r);process.exit(1)}"
