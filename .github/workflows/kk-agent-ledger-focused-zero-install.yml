name: KK Agent Ledger Focused OIDC Regression (Zero Install)

# Independent exact-head scoped confidence. The existing full-repository CI
# remains a separate mandatory release gate; this does NOT approve Edge deploy.
on:
  pull_request:
    paths:
      - 'supabase/functions/kk-project-memory-github-read/index.ts'
      - 'tests/kk-github-oidc-agent-ledger-runtime-regression.test.js'
      - 'tests/kk-agent-invocation-oidc-persistence.test.js'
      - 'tests/project-memory-github-oidc.test.js'
      - 'config/kk-project-memory.json'
      - '.github/workflows/kk-agent-ledger-focused-zero-install.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kk-ledger-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scoped-oidc-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact PR head with no credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source and no service credentials
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node --version
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          test -z "${VERCEL_TOKEN:-}"
          test -z "${OPENAI_API_KEY:-}"
      - name: Run actual focused OIDC, Ledger, Gateway and Project Memory tests
        run: |
          node --test \
            tests/kk-github-oidc-agent-ledger-runtime-regression.test.js \
            tests/kk-agent-invocation-oidc-persistence.test.js \
            tests/project-memory-github-oidc.test.js \
            tests/kk-agent-gateway.test.js \
            tests/kk-project-memory.test.js
