name: Apps Script Timing Zero-Write Readback

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apps-script-timing-zero-write-readback.yml'
      - 'scripts/apps-script-timing-readback.js'
      - 'tests/apps-script-timing-readback.test.js'
      - 'docs/APPS_SCRIPT_TIMING_ZERO_WRITE_READBACK_2026-09-27.md'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_uaeOdVIjXMSW690ZM2wPuJyt
      VERCEL_PROJECT_ID: prj_snbAmpya7YGmOuMbv1o8T16ouxl6

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Regression for the zero-write probe
        run: node --test tests/apps-script-timing-readback.test.js

      - name: Require Vercel token without exposing it
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - name: Pull Production environment into ephemeral runner only
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          npm install --no-save vercel@latest >/dev/null
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN" >/tmp/vercel-pull.log 2>&1
          test -f .vercel/.env.production.local
          chmod 600 .vercel/.env.production.local

      - name: Read Apps Script effective timing through phase1Health only
        id: probe
        shell: bash
        run: |
          set +e
          node scripts/apps-script-timing-readback.js .vercel/.env.production.local > apps-script-timing-readback.json
          CODE=$?
          set -e
          test -s apps-script-timing-readback.json
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('apps-script-timing-readback.json','utf8'));
          if(r.safety.apps_script_writes!==0 || r.safety.sheet_business_writes!==0 || r.safety.trigger_mutations!==0 || r.safety.timezone_mutations!==0) throw new Error('ZERO_WRITE_BOUNDARY_VIOLATION');
          console.log('Probe status:',r.status);
          console.log('Apps Script URL present:',r.config&&r.config.kk_admin_script_url_present);
          console.log('Apps Script URL host:',r.config&&r.config.kk_admin_script_url_host);
          console.log('Apps Script URL path kind:',r.config&&r.config.kk_admin_script_url_path_kind);
          if(r.status==='READBACK_COMPLETE'){
            console.log('Apps Script effective offset verified:',r.timing.inferred_offset);
            console.log('Named timezone explicitly exposed:',r.timing.named_timezone_explicitly_exposed);
            console.log('Installed trigger readback exposed:',r.installed_triggers.readback_exposed_by_phase1_health);
          }
          NODE
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Publish secret-safe evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-timing-zero-write-readback-${{ github.run_id }}
          path: apps-script-timing-readback.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record secret-safe result on PR
        if: ${{ always() && hashFiles('apps-script-timing-readback.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' > /tmp/readback-comment.md
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('apps-script-timing-readback.json','utf8'));
          const complete=r.status==='READBACK_COMPLETE';
          const lines=[
            '### Apps Script timing zero-write readback',
            '',
            '- Probe status: **'+String(r.status||'UNKNOWN')+'**',
            '- Production Apps Script URL configured: **'+(r.config&&r.config.kk_admin_script_url_present?'YES':'NO')+'**',
            '- URL host classification: **'+String(r.config&&r.config.kk_admin_script_url_host||'unparseable')+'**',
            '- URL path classification: **'+String(r.config&&r.config.kk_admin_script_url_path_kind||'unparseable')+'**',
            '- Phase1 Health: **'+(complete?'PASS':'NOT REACHED')+'**',
            '- Backend/Sheet identity: **'+(complete?(r.phase1_health.frontend_backend_same_sheet?'MATCH':'MISMATCH'):'UNVERIFIED')+'**',
            '- Observed Apps Script effective UTC offset: **'+(complete?(r.timing.inferred_offset||'unknown'):'UNVERIFIED')+'**',
            '- Effective UTC+07:00 verified: **'+(complete&&r.timing.effective_utc_plus_7_verified?'YES':'NO')+'**',
            '- Named Project timezone explicitly exposed by deployed read-only API: **'+(complete&&r.timing.named_timezone_explicitly_exposed?'YES':'NO')+'**',
            '- Installed-trigger readback exposed by deployed read-only API: **'+(complete&&r.installed_triggers.readback_exposed_by_phase1_health?'YES':'NO')+'**',
            '- `kkCleanupOldData30DaysAuto` directly verified: **'+(complete&&r.installed_triggers.cleanup_trigger_verified?'YES':'NO')+'**',
            '',
            'Safety: read-only diagnostic path only; Apps Script writes 0; Sheet business writes 0; trigger/timezone mutations 0; raw URL, API key and Sheet ID values are never included in the artifact/comment.',
            '',
            complete
              ? 'Interpretation: effective timing was observed from the live Apps Script formatter. Named timezone / installed trigger remain fail-closed unless explicitly exposed.'
              : 'Interpretation: the Production Apps Script configuration blocked the read-only probe before any Apps Script request. No setting was changed to bypass the blocker.'
          ];
          process.stdout.write(lines.join('\n'));
          NODE
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$(cat /tmp/readback-comment.md)" >/dev/null

      - name: Require completed live readback
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('apps-script-timing-readback.json','utf8'));
          if(r.status!=='READBACK_COMPLETE') throw new Error('LIVE_READBACK_NOT_COMPLETED_'+String(r.error_code||'UNKNOWN'));
          if(r.timing.effective_utc_plus_7_verified!==true) throw new Error('UTC_PLUS_7_NOT_VERIFIED');
          NODE
