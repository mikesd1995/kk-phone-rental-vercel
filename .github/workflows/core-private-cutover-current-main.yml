name: Core Private Cutover Source Safety (Draft Only)

on:
  push:
    branches: [fix/p0-core-private-preflight-current-main-20261102]
    paths:
      - 'server/core-sheet-private-reader.js'
      - 'scripts/core-private-cutover-preflight.cjs'
      - 'tests/core-sheet-privacy-cutover.test.js'
      - 'tests/core-private-cutover-preflight.test.js'
      - 'server/admin-sheet-fallback.js'
      - 'tests/admin-sheet-fallback-private-reader.test.js'
      - 'tests/hardening-phase2-share-runtime.test.js'
      - '.github/workflows/core-private-cutover-current-main.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-private-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-provider-write-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate without retained credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact push SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Code Intelligence bounded task context
        run: npm run code:context -- "private Core reader transport sanitization thirteen-dataset cutover header schema no production writes"
      - name: Source syntax
        run: |
          node --check server/core-sheet-private-reader.js
          node --check scripts/core-private-cutover-preflight.cjs
          node --check tests/core-sheet-privacy-cutover.test.js
          node --check tests/core-private-cutover-preflight.test.js
          node --check server/admin-sheet-fallback.js
          node --check tests/admin-sheet-fallback-private-reader.test.js
      - name: Strict private-reader offline regression
        run: node --test tests/core-private-cutover-preflight.test.js tests/core-sheet-privacy-cutover.test.js tests/admin-sheet-fallback-private-reader.test.js
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - name: Complete repository syntax regression
        run: npm run check
      - name: Full repository regression and poster permission offline tests
        run: npm test
      - name: Continuous invariant source gate
        run: npm run audit:invariants
      - name: No provider keys or mutating privileges
        run: |
          test -z "${KK_CORE_PRIVATE_READ_KEY:-}"
          test -z "${KK_ADMIN_API_KEY:-}"
          echo "No remote Core, booking, ACL, GAS, Vercel, Make or customer writes in this job."
