name: TEMP Vercel Token Presence Probe V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/vercel-token-presence-probe-v2.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Report token presence only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN_PRESENT"
          else
            echo "VERCEL_TOKEN_MISSING"
          fi
