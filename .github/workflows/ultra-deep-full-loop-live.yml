name: Ultra Deep Full Loop Live
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: kk-ultra-deep-full-loop-live
  cancel-in-progress: false
jobs:
  execute:
    if: ${{ github.event.issue.number == 368 && github.event.comment.user.login == github.repository_owner && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '/run-ultra-deep-full-loop-live ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require owner and parse month
        id: authz
        shell: bash
        env:
          BODY: ${{ github.event.comment.body }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$ACTOR" = "$OWNER"
          MONTH="$(printf '%s' "$BODY" | awk '{print $2}')"
          printf '%s' "$MONTH" | grep -Eq '^20[0-9]{2}-(0[1-9]|1[0-2])$'
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Pin exact current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - name: Targeted Full Loop regressions
        run: |
          set -euo pipefail
          node --test tests/kk-ultra-deep-candidate-verifier.test.js
          node --test tests/kk-ultra-deep-competitor-scan.test.js
          node --test tests/kk-ultra-deep-full-loop-orchestrator.test.js
          node --test tests/kk-verifier-storefront-promotion.test.js
          node --test tests/kk-governed-storefront-executor.test.js
      - name: Install pinned zero-cost search fallback
        run: python3 -m pip install --disable-pip-version-check --no-input 'ddgs==9.14.4'
      - name: Resolve production Admin credential ephemerally
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_snbAmpya7YGmOuMbv1o8T16ouxl6
          VERCEL_ORG_ID: team_uaeOdVIjXMSW690ZM2wPuJyt
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          node - <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const u=new URL('https://api.vercel.com/v10/projects/'+process.env.VERCEL_PROJECT_ID+'/env');
            u.searchParams.set('decrypt','true');u.searchParams.set('teamId',process.env.VERCEL_ORG_ID);
            const r=await fetch(u,{headers:{Authorization:'Bearer '+process.env.VERCEL_TOKEN}});
            if(!r.ok)throw new Error('VERCEL_ENV_HTTP_'+r.status);
            const j=await r.json();const row=(j.envs||[]).find(x=>x.key==='KK_ADMIN_PIN'&&(!x.target||x.target.includes('production')));
            if(!row||!row.value)throw new Error('KK_ADMIN_PIN_NOT_RESOLVED');
            const value=String(row.value).replace(/\n/g,'');
            process.stdout.write('::add-mask::'+value+'\n');
            fs.appendFileSync(process.env.GITHUB_ENV,'KK_ADMIN_PIN='+value+'\n');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
      - name: Discovery FULL
        env:
          KK_DDGS_TRAFILATURA_ENABLED: '1'
        run: |
          set -euo pipefail
          node scripts/kk-ultra-deep-runtime-acceptance.js --month "${{ steps.authz.outputs.month }}" --location "Bangkok Thailand" --output ultra-deep-runtime-acceptance.json > ultra-deep-runtime-summary.json
          node -e "const r=require('./ultra-deep-runtime-acceptance.json');if(r.full!==true||r.status!=='READY_FOR_VERIFIER'||r.production_writes!==0)process.exit(1)"
      - name: Verify compare reconcile publish and read back
        id: full_loop
        continue-on-error: true
        env:
          KK_DDGS_TRAFILATURA_ENABLED: '1'
          KK_SITE_URL: https://kk-phone-rental.vercel.app
        run: |
          set -o pipefail
          node scripts/kk-ultra-deep-full-loop-live.js --month "${{ steps.authz.outputs.month }}" --discovery ultra-deep-runtime-acceptance.json --output ultra-deep-full-loop-live.json 2>&1 | tee ultra-deep-full-loop-live.log
      - name: Post terminal owner-visible result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.full_loop.outcome }}
        run: |
          node - <<'NODE' > body.txt
          const fs=require('node:fs');let r={};try{r=JSON.parse(fs.readFileSync('ultra-deep-full-loop-live.json','utf8'))}catch(_){}
          const x=r.result||{},v=r.verifier||{},c=r.competitor||{},counts={};
          for(const row of x.rows||[])counts[row.status]=(counts[row.status]||0)+1;
          console.log(['## Ultra Deep Full Loop Live — '+(x.status||process.env.OUTCOME),'','- Run: '+process.env.RUN_ID,'- Verifier: '+(v.verified_count||0)+' verified / '+(v.hold_count||0)+' held','- Exact competitor price evidence: '+(c.evidence_count||0)+' rows across '+(c.events_with_exact_evidence||0)+' events','- Production writes with governed readback: '+(x.production_writes||0),'- Result counts: '+JSON.stringify(counts),'- Completion: '+(x.production_completion_claim_allowed===true?'PROVEN':'NOT_PROVEN'),'','Artifact retains discovery/verifier/commercial/promotion/readback evidence. No credential is stored in artifacts.'].join('\n'));
          NODE
          gh api "repos/$REPO/issues/$ISSUE/comments" -f body="$(cat body.txt)"
      - name: Upload secret-safe Full Loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultra-deep-full-loop-live-${{ github.run_id }}
          path: |
            ultra-deep-runtime-acceptance.json
            ultra-deep-runtime-summary.json
            ultra-deep-full-loop-live.json
            ultra-deep-full-loop-live.log
          if-no-files-found: warn
          retention-days: 30
      - name: Require proven terminal completion
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.full_loop.outcome }}" = "success"
          node -e "const r=require('./ultra-deep-full-loop-live.json');if(r.result?.status!=='COMPLETE'||r.result?.production_completion_claim_allowed!==true)process.exit(1)"
