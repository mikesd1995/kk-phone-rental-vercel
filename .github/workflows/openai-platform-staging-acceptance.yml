name: OpenAI Optional Zero-Cost Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/kk-openai-platform.js'
      - 'server/kk-openai-agent-adapters.js'
      - 'server/kk-openai-staging-probe.js'
      - 'server/kk-agent-registry.js'
      - 'server/kk-agent-task-router.js'
      - 'api/kk-intelligence-health.js'
      - 'tests/kk-openai-platform.test.js'
      - 'tests/kk-openai-staging-probe.test.js'
      - 'tests/storefront-visual-qa-automation.test.js'
      - 'scripts/kk-openai-agent-dry-run.js'
      - 'scripts/storefront-visual-acceptance.mjs'
      - '.github/workflows/openai-platform-staging-acceptance.yml'
      - 'docs/OPENAI_PLATFORM_AGENT_LAYER_V1_2026-10-02.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kk-openai-zero-cost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPROVED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 1

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Run private customer-data guards first so a separate visual/source
      # failure cannot hide exact-head security regression evidence.
      # Until core-sheet-privacy-exact-head.yml is installed on main, run the
      # exact-head private-Core source tests in an existing standard/public runner.
      # No npm install, provider tokens, production requests or paid services.
      - name: Full Core privacy source regression (zero provider / exact HEAD)
        shell: bash
        env:
          KK_CORE_SHEET_REQUIRE_PRIVATE: 'false'
        run: |
          set -euo pipefail
          node --test \
            tests/core-sheet-privacy-cutover.test.js \
            tests/core-private-cutover-preflight.test.js \
            tests/core-apps-script-private-reader.test.js \
            tests/core-apps-script-public-get-privacy.test.js \
            tests/core-read-only-key-isolation.test.js \
            tests/core-read-key-owner-setup.test.js \
            tests/admin-sheet-fallback-private-reader.test.js \
            tests/public-data-proxy.test.js \
            tests/public-data-browser-privacy.test.js \
            tests/core-sheet-privacy-workflow-contract.test.js

      - name: Zero-cost source safety regression
        shell: bash
        run: |
          set -euo pipefail
          node --check server/kk-openai-platform.js
          node --check server/kk-openai-agent-adapters.js
          node --check server/kk-openai-staging-probe.js
          node --check server/kk-agent-task-router.js
          node --check scripts/kk-openai-agent-dry-run.js
          node --check scripts/storefront-visual-acceptance.mjs
          node --check api/kk-intelligence-health.js
          node --test tests/kk-openai-platform.test.js tests/kk-openai-staging-probe.test.js tests/storefront-visual-qa-automation.test.js

      - name: Execute zero-cost no-provider acceptance
        shell: bash
        env:
          KK_OPENAI_PLATFORM_ENABLED: 'true'
          KK_ALLOW_PAID_EXTERNAL_AI: 'false'
          KK_OPENAI_ALLOW_CUSTOMER_DATA: 'false'
          OPENAI_API_KEY: 'sk-proj-synthetic-zero-cost-fixture-1234567890'
          KK_ZERO_COST_ASSERT: 'true'
          KK_OPENAI_REPORT_PATH: 'openai-zero-cost-report.json'
        run: |
          set -euo pipefail
          node scripts/kk-openai-agent-dry-run.js
          test -s openai-zero-cost-report.json

          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('openai-zero-cost-report.json','utf8'));
          if(report.requested!==true) throw new Error('OPENAI_REQUEST_FLAG_NOT_EXERCISED');
          if(report.paid_external_ai_allowed!==false) throw new Error('PAID_EXTERNAL_AI_WAIVER_MUST_BE_FALSE');
          if(report.enabled!==false) throw new Error('PAID_OPENAI_RUNTIME_MUST_STAY_DISABLED');
          if(report.zero_cost_mode!==true) throw new Error('ZERO_COST_MODE_NOT_ACTIVE');
          if(Number(report.provider_requests)!==0) throw new Error('PAID_PROVIDER_REQUEST_DETECTED');
          if(report.allow_customer_data!==false) throw new Error('CUSTOMER_DATA_GATE_MUST_STAY_DISABLED');

          const rows=Array.isArray(report.results)?report.results:[];
          if(rows.length!==3) throw new Error('ZERO_COST_ACCEPTANCE_ROWS_MISSING');
          if(rows.some(row=>Number(row.production_writes)!==0)) throw new Error('PRODUCTION_WRITES_NONZERO');
          if(rows[0].status!=='DETERMINISTIC_READY') throw new Error('STOREFRONT_DETERMINISTIC_PATH_NOT_READY');
          if(!['SEARCH_GAPS_REQUIRED','COVERAGE_COMPLETE'].includes(rows[1].status)) throw new Error('DISCOVERY_DETERMINISTIC_PATH_NOT_READY');
          if(rows[0].ai_status!=='DISABLED_ZERO_COST_POLICY') throw new Error('STOREFRONT_PAID_AI_NOT_DISABLED');
          if(rows[1].ai_status!=='DISABLED_ZERO_COST_POLICY') throw new Error('DISCOVERY_PAID_AI_NOT_DISABLED');
          if(rows[2].ai_status!=='SKIPPED_CUSTOMER_DATA_GATE') throw new Error('INBOX_CUSTOMER_DATA_GATE_NOT_DISABLED');
          if(rows.slice(0,2).some(row=>Number(row.http_status)!==0||row.request_id||row.provider_error_code)) {
            throw new Error('PROVIDER_EVIDENCE_PRESENT_IN_ZERO_COST_MODE');
          }
          NODE

      - name: Upload zero-cost acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openai-zero-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: openai-zero-cost-report.json
          if-no-files-found: warn
          retention-days: 14
