name: OpenAI Platform Staging Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/kk-openai-platform.js'
      - 'server/kk-openai-agent-adapters.js'
      - 'server/kk-openai-staging-probe.js'
      - 'server/kk-agent-registry.js'
      - 'server/kk-agent-task-router.js'
      - 'api/kk-intelligence-health.js'
      - 'tests/kk-openai-platform.test.js'
      - 'tests/kk-openai-staging-probe.test.js'
      - 'scripts/kk-openai-agent-dry-run.js'
      - 'scripts/storefront-visual-acceptance.mjs'
      - 'tests/storefront-visual-qa-automation.test.js'
      - '.github/workflows/openai-platform-staging-acceptance.yml'
      - 'docs/OPENAI_PLATFORM_AGENT_LAYER_V1_2026-10-02.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kk-openai-platform-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_uaeOdVIjXMSW690ZM2wPuJyt
      VERCEL_PROJECT_ID: prj_snbAmpya7YGmOuMbv1o8T16ouxl6
      KK_OPENAI_BRANCH: feat/openai-platform-agent-layer-v1
      APPROVED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 50

      - name: Verify exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Source safety regression
        shell: bash
        run: |
          set -euo pipefail
          node --check server/kk-openai-platform.js
          node --check server/kk-openai-agent-adapters.js
          node --check server/kk-openai-staging-probe.js
          node --check scripts/kk-openai-agent-dry-run.js
          node --check api/kk-intelligence-health.js
          node --test tests/kk-openai-platform.test.js tests/kk-openai-staging-probe.test.js

      - name: Require Vercel owner token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - name: Install Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save vercel@latest >/dev/null
          npx vercel --version

      - name: Link project ephemerally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Find exact or runtime-equivalent READY Preview
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import cp from 'node:child_process';

          const headSha=String(process.env.APPROVED_SHA||'').trim().toLowerCase();
          const branch=String(process.env.KK_OPENAI_BRANCH||'').trim();
          const token=String(process.env.VERCEL_TOKEN||'').trim();
          if(!/^[0-9a-f]{40}$/.test(headSha)||!token) throw new Error('PREVIEW_LOOKUP_CONFIG_INVALID');

          const url='https://api.vercel.com/v6/deployments?projectId='+encodeURIComponent(process.env.VERCEL_PROJECT_ID)+'&teamId='+encodeURIComponent(process.env.VERCEL_ORG_ID)+'&limit=100';
          const res=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
          if(!res.ok) throw new Error('VERCEL_DEPLOYMENTS_HTTP_'+res.status);
          const deployments=(await res.json()).deployments||[];

          const bySha=new Map();
          for(const d of deployments){
            const sha=String(d?.meta?.githubCommitSha||'').toLowerCase();
            const ref=String(d?.meta?.githubCommitRef||'');
            const ready=['READY','COMPLETED'].includes(String(d?.state||d?.readyState||'').toUpperCase());
            const preview=String(d?.target||'').toLowerCase()!=='production';
            if(/^[0-9a-f]{40}$/.test(sha)&&ref===branch&&ready&&preview&&!bySha.has(sha)) bySha.set(sha,d);
          }

          let runtimeSha=headSha;
          let match=bySha.get(headSha)||null;
          let mode='EXACT_HEAD';

          if(!match){
            const ciOnly=new Set(['.github/workflows/openai-platform-staging-acceptance.yml']);
            const ancestors=cp.execFileSync('git',['rev-list','--first-parent','--max-count=40','HEAD'],{encoding:'utf8'})
              .trim().split(/\s+/).filter(Boolean);
            for(const candidate of ancestors.slice(1)){
              const deployment=bySha.get(candidate);
              if(!deployment) continue;
              const changed=cp.execFileSync('git',['diff','--name-only',candidate,headSha],{encoding:'utf8'})
                .trim().split(/\r?\n/).filter(Boolean);
              if(changed.length>0&&changed.every(path=>ciOnly.has(path))){
                runtimeSha=candidate;
                match=deployment;
                mode='CI_ONLY_RUNTIME_EQUIVALENT';
                break;
              }
            }
          }

          if(match&&match.url){
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'found=true\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'url=https://'+String(match.url).replace(/^https?:\/\//,'')+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'deployment_id='+String(match.uid||match.id||'')+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'runtime_sha='+runtimeSha+'\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'mode='+mode+'\n');
          }else{
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'found=false\n');
            fs.writeFileSync('openai-agent-staging-report.json',JSON.stringify({
              schema_version:'KK_OPENAI_AGENT_STAGING_RUNTIME_V3',
              status:'BLOCKED_PREVIEW_DEPLOYMENT_REQUIRED',
              expected_sha:headSha,
              branch,
              production_writes:0
            },null,2)+'\n');
          }
          NODE

      - name: Execute protected Preview runtime acceptance
        if: ${{ steps.preview.outputs.found == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          npx vercel --token="$VERCEL_TOKEN" curl '/api/kk-intelligence-health?mode=openai-staging' \
            --deployment "${{ steps.preview.outputs.url }}" \
            -- \
            --request POST \
            --header 'Content-Type: application/json' \
            --data '{"confirm":"RUN_OPENAI_STAGING_PROBE"}' \
            --fail-with-body \
            --silent \
            --show-error \
            > openai-agent-staging-report.json

          node --input-type=commonjs - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('openai-agent-staging-report.json','utf8'));
          if(report.ok!==true||report.status!=='PASS') throw new Error('OPENAI_RUNTIME_ACCEPTANCE_FAILED');
          if(report.preview!==true||report.branch!==process.env.KK_OPENAI_BRANCH||report.commit_sha!=='${{ steps.preview.outputs.runtime_sha }}') throw new Error('PREVIEW_IDENTITY_MISMATCH');
          if(report.platform_enabled!==true||report.api_key_present!==true||report.customer_data_allowed!==false) throw new Error('OPENAI_RUNTIME_CONFIG_INVALID');
          if(Number(report.production_writes)!==0) throw new Error('PRODUCTION_WRITES_NONZERO');
          if(!report.storefront||report.storefront.ai_status!=='READY_FOR_DESIGN_SYNTHESIS') throw new Error('STOREFRONT_OPENAI_ACCEPTANCE_FAILED');
          if(!report.discovery||report.discovery.ai_status!=='ADVISORY_READY_FOR_VERIFIER') throw new Error('DISCOVERY_OPENAI_ACCEPTANCE_FAILED');
          report.accepted_head_sha=process.env.APPROVED_SHA;
          report.runtime_sha='${{ steps.preview.outputs.runtime_sha }}';
          report.runtime_equivalence_mode='${{ steps.preview.outputs.mode }}';
          fs.writeFileSync('openai-agent-staging-report.json',JSON.stringify(report,null,2)+'\\n');
          NODE

      - name: Require exact Preview runtime
        if: ${{ steps.preview.outputs.found != 'true' }}
        shell: bash
        run: |
          echo 'BLOCKED_PREVIEW_DEPLOYMENT_REQUIRED: no exact or CI-only-runtime-equivalent READY Preview is available.'
          exit 1

      - name: Upload secret-safe acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openai-platform-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: openai-agent-staging-report.json
          if-no-files-found: warn
          retention-days: 14
