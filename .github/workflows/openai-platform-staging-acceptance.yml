name: OpenAI Platform Staging Acceptance

on:
  pull_request:
    paths:
      - 'server/kk-openai-platform.js'
      - 'server/kk-openai-agent-adapters.js'
      - 'server/kk-agent-registry.js'
      - 'server/kk-agent-task-router.js'
      - 'scripts/kk-openai-agent-dry-run.js'
      - '.github/workflows/openai-platform-staging-acceptance.yml'
      - 'docs/OPENAI_PLATFORM_AGENT_LAYER_V1_2026-10-02.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kk-openai-platform-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staging-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_uaeOdVIjXMSW690ZM2wPuJyt
      VERCEL_PROJECT_ID: prj_snbAmpya7YGmOuMbv1o8T16ouxl6
      KK_OPENAI_BRANCH: feat/openai-platform-agent-layer-v1

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Source safety regression
        run: |
          set -euo pipefail
          node --check server/kk-openai-platform.js
          node --check server/kk-openai-agent-adapters.js
          node --check scripts/kk-openai-agent-dry-run.js
          node --test tests/kk-openai-platform.test.js

      - name: Require existing Vercel owner token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"

      - name: Install Vercel CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save vercel@latest >/dev/null
          npx vercel --version

      - name: Link project ephemerally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Execute branch-scoped Preview acceptance via Vercel env run
        id: live
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          set +x

          npx vercel env run \
            --environment=preview \
            --git-branch="$KK_OPENAI_BRANCH" \
            --token="$VERCEL_TOKEN" \
            -- node scripts/kk-openai-agent-dry-run.js \
            > openai-agent-staging-report.json

          test -s openai-agent-staging-report.json

          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('openai-agent-staging-report.json','utf8'));
          if(report.enabled!==true) throw new Error('OPENAI_PLATFORM_NOT_ENABLED');
          if(report.api_key_present!==true) throw new Error('OPENAI_API_KEY_NOT_INJECTED');
          if(report.allow_customer_data!==false) throw new Error('CUSTOMER_DATA_GATE_MUST_STAY_DISABLED');
          const shape=report.api_key_diagnostics||{};
          if(shape.starts_with_sk!==true || shape.ascii_token_charset!==true || Number(shape.normalized_length)<20){
            throw new Error('OPENAI_API_KEY_SHAPE_INVALID');
          }
          const storefront=(report.results||[]).find(row=>(row.invoked_agents||[]).includes('kk-openai-storefront-reviewer'));
          const discovery=(report.results||[]).find(row=>(row.invoked_agents||[]).includes('kk-openai-discovery-reasoner'));
          if(!storefront || storefront.ai_status!=='READY_FOR_DESIGN_SYNTHESIS'){
            throw new Error('STOREFRONT_OPENAI_ACCEPTANCE_FAILED');
          }
          if(!discovery || discovery.ai_status!=='ADVISORY_READY_FOR_VERIFIER'){
            throw new Error('DISCOVERY_OPENAI_ACCEPTANCE_FAILED');
          }
          if((report.results||[]).some(row=>Number(row.production_writes)!==0)){
            throw new Error('PRODUCTION_WRITES_NONZERO');
          }
          NODE

      - name: Upload secret-safe acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openai-platform-staging-${{ github.run_id }}
          path: openai-agent-staging-report.json
          if-no-files-found: warn
          retention-days: 14
