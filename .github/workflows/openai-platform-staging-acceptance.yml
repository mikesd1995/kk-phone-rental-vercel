name: OpenAI Platform Staging Acceptance
on:
  push:
    branches:
      - feat/openai-platform-agent-layer-v1
  pull_request:
    paths:
      - 'server/kk-openai-platform.js'
      - 'server/kk-openai-agent-adapters.js'
      - 'server/kk-openai-staging-probe.js'
      - 'server/kk-agent-registry.js'
      - 'server/kk-agent-task-router.js'
      - 'api/kk-intelligence-health.js'
      - 'tests/kk-openai-staging-probe.test.js'
      - 'scripts/kk-openai-agent-dry-run.js'
      - '.github/workflows/openai-platform-staging-acceptance.yml'
      - 'docs/OPENAI_PLATFORM_AGENT_LAYER_V1_2026-10-02.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kk-openai-platform-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  staging-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: team_uaeOdVIjXMSW690ZM2wPuJyt
      VERCEL_PROJECT_ID: prj_snbAmpya7YGmOuMbv1o8T16ouxl6
      KK_OPENAI_BRANCH: feat/openai-platform-agent-layer-v1
      APPROVED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 1
      - name: Verify exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Source safety regression
        run: |
          set -euo pipefail
          node --check server/kk-openai-platform.js
          node --check server/kk-openai-agent-adapters.js
          node --check server/kk-openai-staging-probe.js
          node --check scripts/kk-openai-agent-dry-run.js
          node --check api/kk-intelligence-health.js
          node --test tests/kk-openai-platform.test.js tests/kk-openai-staging-probe.test.js
      - name: Require existing Vercel owner token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
      - name: Install Vercel CLI
        run: |
          set -euo pipefail
          npm install --no-save vercel@latest >/dev/null
          npx vercel --version
      - name: Link project ephemerally
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Execute branch-scoped zero-write staging acceptance
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          npx vercel env run \
            --environment=preview \
            --git-branch="$KK_OPENAI_BRANCH" \
            --token="$VERCEL_TOKEN" \
            -- node scripts/kk-openai-agent-dry-run.js \
            > openai-agent-staging-report.json

          node - <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('openai-agent-staging-report.json','utf8'));
          if(report.enabled!==true) throw new Error('OPENAI_PLATFORM_NOT_ENABLED');
          if(report.api_key_present!==true) throw new Error('OPENAI_API_KEY_NOT_INJECTED');
          if(report.allow_customer_data!==false) throw new Error('CUSTOMER_DATA_GATE_MUST_STAY_DISABLED');
          const rows=Array.isArray(report.results)?report.results:[];
          if(rows.length<2) throw new Error('OPENAI_ACCEPTANCE_ROWS_MISSING');
          if(rows.some(row=>Number(row.production_writes)!==0)) throw new Error('PRODUCTION_WRITES_NONZERO');
          if(rows[0].ai_status!=='READY_FOR_DESIGN_SYNTHESIS') throw new Error('STOREFRONT_OPENAI_ACCEPTANCE_FAILED');
          if(rows[1].ai_status!=='ADVISORY_READY_FOR_VERIFIER') throw new Error('DISCOVERY_OPENAI_ACCEPTANCE_FAILED');
          NODE

      - name: Upload secret-safe acceptance report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openai-platform-staging-${{ github.run_id }}
          path: openai-agent-staging-report.json
          if-no-files-found: warn
          retention-days: 14
