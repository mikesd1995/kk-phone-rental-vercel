name: Ultra Deep Full Loop Direct

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      month:
        description: 'YYYY-MM month'
        required: true
        default: '2026-10'
        type: string
      confirm:
        description: 'Type RUN_ULTRA_DEEP_FULL_LOOP'
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 368 &&
          github.event.comment.user.login == github.repository_owner &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '/run-ultra-deep-full-loop')
        )
      )
      && 'kk-ultra-deep-full-loop'
      || format('kk-ultra-deep-noncommand-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  full-loop:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 368 &&
          github.event.comment.user.login == github.repository_owner &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '/run-ultra-deep-full-loop')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Authorize direct trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
          MANUAL_MONTH: ${{ inputs.month }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRM" = "RUN_ULTRA_DEEP_FULL_LOOP"
            printf '%s' "$MANUAL_MONTH" | grep -Eq '^[0-9]{4}-[0-9]{2}$'
            MONTH="$MANUAL_MONTH"
            test "$GITHUB_REF" = "refs/heads/main"
          else
            test "$ISSUE_NUMBER" = "368"
            test "$COMMENT_LOGIN" = "$OWNER"
            test "$COMMENT_ASSOCIATION" = "OWNER"
            BODY="$(printf '%s' "$COMMENT_BODY" | tr -d '\r')"
            if [[ "$BODY" =~ ^/run-ultra-deep-full-loop([[:space:]]+([0-9]{4}-[0-9]{2}))?[[:space:]]*$ ]]; then
              MONTH="${BASH_REMATCH[2]:-$(date -u +%Y-%m)}"
            else
              echo "Invalid command: $BODY" >&2
              exit 1
            fi
          fi
          echo "SCAN_MONTH=$MONTH" >> "$GITHUB_ENV"

      - name: Announce RUNNING
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/github-script@v8
        with:
          script: |
            const month = process.env.SCAN_MONTH;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🟡 Ultra Deep Full Loop **RUNNING** for \`${month}\`\n\nProgress: ${runUrl}\n\nLatest command wins: a newer command cancels this run instead of waiting in queue.`
            });

      - name: Checkout exact current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Pin exact current main
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT="$(git rev-parse HEAD)"
          CURRENT="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$CHECKED_OUT" = "$CURRENT"
          echo "sha=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Full-loop targeted regressions
        run: |
          set -euo pipefail
          node --test tests/kk-ultra-deep-owner-policy.test.js
          node --test tests/kk-ultra-deep-full-loop-orchestrator.test.js
          node --test tests/kk-ultra-deep-full-loop-completion-gate.test.js
          node --test tests/kk-ultra-deep-public-web-adapters.test.js
          node --test tests/kk-ultra-deep-runtime-runner.test.js

      - name: Install pinned zero-cost DDGS fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'ddgs==9.14.4'

      - name: Execute live discovery acceptance
        id: scan
        continue-on-error: true
        shell: bash
        env:
          KK_DDGS_TRAFILATURA_ENABLED: '1'
        run: |
          set -euo pipefail
          node scripts/kk-ultra-deep-runtime-acceptance.js \
            --month "$SCAN_MONTH" \
            --location "Bangkok Thailand" \
            --output ultra-deep-runtime-acceptance.json \
            > ultra-deep-runtime-summary.json

      - name: Require discovery FULL before business stages
        id: gate
        if: always()
        continue-on-error: true
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          set -euo pipefail
          test "$SCAN_OUTCOME" = "success"
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('ultra-deep-runtime-acceptance.json','utf8'));
          if(r.full!==true||r.status!=='READY_FOR_VERIFIER') process.exit(1);
          if(r.provider_binding?.unknown_url_search_bound!==true) process.exit(1);
          if(r.discovery_proof?.complete!==true) process.exit(1);
          if(r.source_universe?.complete!==true) process.exit(1);
          if(r.reference_sweep_proof?.complete!==true) process.exit(1);
          if(r.reconciliation?.reconciliation_gap_count!==0) process.exit(1);
          if(r.known_miss_regression?.complete!==true) process.exit(1);
          if(r.production_writes!==0) process.exit(1);
          NODE

      - name: Record governed Full Loop handoff
        if: ${{ steps.gate.outcome == 'success' }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('ultra-deep-runtime-acceptance.json','utf8'));
          fs.writeFileSync('ultra-deep-full-loop-handoff.json',JSON.stringify({
            schema_version:'KK_ULTRA_DEEP_FULL_LOOP_HANDOFF_V2',
            month:r.month,
            discovery:r,
            candidates:r.candidates||[],
            next_route:'execute_ultra_deep_full_loop',
            production_writes:0
          },null,2));
          NODE

      - name: Publish live progress summary
        if: always()
        shell: bash
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          PINNED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          {
            echo "### Ultra Deep Full Loop"
            echo "- month: $SCAN_MONTH"
            echo "- main: $PINNED_SHA"
            echo "- discovery: $SCAN_OUTCOME"
            echo "- FULL gate: $GATE_OUTCOME"
            if [ -f ultra-deep-runtime-summary.json ]; then
              echo '~~~json'
              cat ultra-deep-runtime-summary.json
              echo '~~~'
            fi
            echo "- production writes at discovery gate: 0"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full-loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultra-deep-full-loop-${{ github.run_id }}
          path: |
            ultra-deep-runtime-acceptance.json
            ultra-deep-runtime-summary.json
            ultra-deep-full-loop-handoff.json
          if-no-files-found: warn
          retention-days: 30

      - name: Notify result in control issue
        if: ${{ always() && github.event_name == 'issue_comment' }}
        uses: actions/github-script@v8
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        with:
          script: |
            const fs = require('fs');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let summary = {};
            try { summary = JSON.parse(fs.readFileSync('ultra-deep-runtime-summary.json','utf8')); } catch {}
            const ok = process.env.GATE_OUTCOME === 'success';
            const blockers = Array.isArray(summary.blockers) && summary.blockers.length ? summary.blockers.join(', ') : 'none';
            const body = [
              ok ? '🟢 Ultra Deep Full Loop **DISCOVERY FULL / READY_FOR_VERIFIER**' : '🔴 Ultra Deep Full Loop **BLOCKED / FAIL-CLOSED**',
              '',
              `Month: \`${process.env.SCAN_MONTH}\``,
              `Candidates: \`${summary.candidate_count ?? 'n/a'}\``,
              `Blockers: \`${blockers}\``,
              `Discovery: \`${process.env.SCAN_OUTCOME}\``,
              `FULL gate: \`${process.env.GATE_OUTCOME}\``,
              '',
              `Run: ${runUrl}`
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail closed when FULL gate is not satisfied
        if: ${{ always() && steps.gate.outcome != 'success' }}
        run: exit 1
