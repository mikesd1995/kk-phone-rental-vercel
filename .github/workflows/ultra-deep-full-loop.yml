name: Ultra Deep Full Loop October

on:
  push:
    branches: [main]
    paths:
      - '.github/ultra-deep-run-request.json'
  workflow_dispatch:
    inputs:
      month:
        description: 'YYYY-MM month'
        required: true
        default: '2026-10'
        type: string
      confirm:
        description: 'Type RUN_ULTRA_DEEP_FULL_LOOP'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kk-ultra-deep-full-loop
  cancel-in-progress: false

jobs:
  full-loop:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm == 'RUN_ULTRA_DEEP_FULL_LOOP' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Pin exact current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - name: Full-loop targeted regressions
        run: |
          node --test tests/kk-ultra-deep-owner-policy.test.js
          node --test tests/kk-ultra-deep-full-loop-orchestrator.test.js
          node --test tests/kk-ultra-deep-full-loop-completion-gate.test.js
      - name: Execute bounded discovery acceptance
        env:
          MONTH: ${{ inputs.month }}
        run: |
          set -euo pipefail
          node scripts/kk-ultra-deep-runtime-acceptance.js --month "$MONTH" --location "Bangkok Thailand" --output ultra-deep-runtime-acceptance.json > ultra-deep-runtime-summary.json
      - name: Require discovery FULL before business stages
        run: |
          node - <<'NODE'
          const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('ultra-deep-runtime-acceptance.json','utf8'));
          if(r.full!==true||r.status!=='READY_FOR_VERIFIER') process.exit(1);
          if(r.production_writes!==0) process.exit(1);
          NODE
      - name: Record full-loop handoff
        run: |
          node - <<'NODE'
          const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('ultra-deep-runtime-acceptance.json','utf8'));
          fs.writeFileSync('ultra-deep-full-loop-handoff.json',JSON.stringify({schema_version:'KK_ULTRA_DEEP_FULL_LOOP_HANDOFF_V1',month:r.month,discovery:r,candidates:r.candidates||[],next_route:'execute_ultra_deep_full_loop',production_writes:0},null,2));
          NODE
      - name: Upload full-loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultra-deep-full-loop-${{ github.run_id }}
          path: |
            ultra-deep-runtime-acceptance.json
            ultra-deep-runtime-summary.json
            ultra-deep-full-loop-handoff.json
          if-no-files-found: warn
          retention-days: 30
