name: Ultra Deep Full Loop Direct

on:
  workflow_call:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      month:
        description: 'YYYY-MM month'
        required: true
        default: '2026-10'
        type: string
      confirm:
        description: 'Type RUN_ULTRA_DEEP_FULL_LOOP'
        required: true
        type: string
      zero_cost_self_hosted:
        description: 'Use dedicated zero-cost self-hosted runner (label kk-ultra-deep)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: >-
    ${{
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issues' &&
          github.event.issue.number == 368 &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'run-ultra-deep-full-loop' &&
          github.actor == github.repository_owner
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 368 &&
          github.event.comment.user.login == github.repository_owner &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '/run-ultra-deep-full-loop')
        )
      )
      && 'kk-ultra-deep-full-loop'
      || format('kk-ultra-deep-noncommand-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  full-loop:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issues' &&
          github.event.issue.number == 368 &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'run-ultra-deep-full-loop' &&
          github.actor == github.repository_owner
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 368 &&
          github.event.comment.user.login == github.repository_owner &&
          github.event.comment.author_association == 'OWNER' &&
          startsWith(github.event.comment.body, '/run-ultra-deep-full-loop')
        )
      }}
    # Zero-cost execution: use a dedicated self-hosted runner when explicitly requested.
    # Default remains GitHub-hosted so existing behavior is unchanged until the runner is registered.
    runs-on: ${{ inputs.zero_cost_self_hosted == true && fromJSON('["self-hosted","linux","x64","kk-ultra-deep"]') || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Zero-cost self-hosted runner preflight
        if: ${{ inputs.zero_cost_self_hosted == true }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ runner.environment }}" = "self-hosted"
          command -v git
          command -v node
          command -v npm
          command -v python3
          command -v curl
          node --version
          python3 --version
          git --version
          df -h .

      - name: Authorize direct trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONFIRM: ${{ inputs.confirm }}
          MANUAL_MONTH: ${{ inputs.month }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$CONFIRM" = "RUN_ULTRA_DEEP_FULL_LOOP"
            printf '%s' "$MANUAL_MONTH" | grep -Eq '^[0-9]{4}-[0-9]{2}$'
            MONTH="$MANUAL_MONTH"
            test "$GITHUB_REF" = "refs/heads/main"
          elif [ "$EVENT_NAME" = "issues" ]; then
            test "$ISSUE_NUMBER" = "368"
            test "$GITHUB_ACTOR" = "$OWNER"
            MONTH="$(date -u +%Y-%m)"
          else
            test "$ISSUE_NUMBER" = "368"
            test "$COMMENT_LOGIN" = "$OWNER"
            test "$COMMENT_ASSOCIATION" = "OWNER"
            BODY="$(printf '%s' "$COMMENT_BODY" | tr -d '\r')"
            if [[ "$BODY" =~ ^/run-ultra-deep-full-loop([[:space:]]+([0-9]{4}-[0-9]{2}))?[[:space:]]*$ ]]; then
              MONTH="${BASH_REMATCH[2]:-$(date -u +%Y-%m)}"
            else
              echo "Invalid command: $BODY" >&2
              exit 1
            fi
          fi
          echo "SCAN_MONTH=$MONTH" >> "$GITHUB_ENV"

      - name: Announce RUNNING
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/github-script@v8
        with:
          script: |
            const month = process.env.SCAN_MONTH;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🟡 Ultra Deep Full Loop **RUNNING** for \`${month}\`\n\nProgress: ${runUrl}\n\nLatest command wins: a newer command cancels this run instead of waiting in queue.`
            });

      - name: Checkout exact current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Pin exact current main
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT="$(git rev-parse HEAD)"
          CURRENT="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$CHECKED_OUT" = "$CURRENT"
          echo "sha=$CURRENT" >> "$GITHUB_OUTPUT"

      - name: Full-loop targeted regressions
        run: |
          set -euo pipefail
          node --test tests/kk-ultra-deep-owner-policy.test.js
          node --test tests/kk-ultra-deep-full-loop-orchestrator.test.js
          node --test tests/kk-ultra-deep-full-loop-completion-gate.test.js
          node --test tests/kk-ultra-deep-public-web-adapters.test.js
          node --test tests/kk-ultra-deep-runtime-runner.test.js
          node --test tests/kk-ultra-deep-reconciliation.test.js
          node --test tests/kk-ultra-deep-candidate-verifier.test.js
          node --test tests/kk-ultra-deep-competitor-price-scanner.test.js
          node --test tests/kk-ultra-deep-production-runtime.test.js
          node --test tests/kk-github-oidc.test.js
          node --test tests/kk-final-pricing-policy.test.js
          node --test tests/kk-verifier-storefront-promotion.test.js
          node --test tests/kk-ultra-deep-direct-workflow.test.js

      - name: Install pinned zero-cost DDGS fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'ddgs==9.14.4'

      - name: Execute live discovery acceptance
        id: scan
        shell: bash
        env:
          KK_DDGS_TRAFILATURA_ENABLED: '1'
        run: |
          set +e
          node scripts/kk-ultra-deep-runtime-acceptance.js \
            --month "$SCAN_MONTH" \
            --location "Bangkok Thailand" \
            --output ultra-deep-runtime-acceptance.json \
            > ultra-deep-runtime-summary.json
          RC=$?
          set -e
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Report discovery checkpoint
        if: ${{ github.event_name == 'issue_comment' }}
        uses: actions/github-script@v8
        env:
          SCAN_RESULT: ${{ steps.scan.outputs.result }}
        with:
          script: |
            const fs=require('fs');
            let r={};
            try { r=JSON.parse(fs.readFileSync('ultra-deep-runtime-acceptance.json','utf8')); } catch {}
            const runUrl=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body=[
              '🔎 Ultra Deep **DISCOVERY CHECKPOINT**',
              '',
              `Candidates: \`${r.candidate_count ?? 'n/a'}\``,
              `Reference candidates: \`${r.reference_candidate_count ?? 'n/a'}\``,
              `Eligible reference candidates: \`${r.eligible_reference_candidate_count ?? 'n/a'}\``,
              `Canonical known-miss alignments: \`${r.canonical_reference_alignment_count ?? 0}\``,
              `Reconciliation gaps: \`${r.reconciliation?.reconciliation_gap_count ?? 'n/a'}\``,
              `Discovery result: \`${process.env.SCAN_RESULT || 'unknown'}\``,
              '',
              'Next: FULL coverage gate → governed business stages.',
              `Progress: ${runUrl}`
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
      - name: Require discovery FULL before business stages
        id: gate
        if: always()
        shell: bash
        env:
          SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$SCAN_EXIT_CODE" = "0"
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('ultra-deep-runtime-acceptance.json','utf8'));
          if(r.full!==true||r.status!=='READY_FOR_VERIFIER') process.exit(1);
          if(r.provider_binding?.unknown_url_search_bound!==true) process.exit(1);
          if(r.discovery_proof?.complete!==true) process.exit(1);
          if(r.source_universe?.complete!==true) process.exit(1);
          if(r.reference_sweep_proof?.complete!==true) process.exit(1);
          if(r.reconciliation?.reconciliation_gap_count!==0) process.exit(1);
          if(r.known_miss_regression?.complete!==true) process.exit(1);
          if(r.production_writes!==0) process.exit(1);
          NODE

      - name: Execute verifier and competitor pricing
        id: commercial
        if: ${{ steps.gate.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          node scripts/kk-ultra-deep-verifier-commercial.js \
            --input ultra-deep-runtime-acceptance.json \
            --output ultra-deep-commercial-handoff.json \
            > ultra-deep-commercial-summary.json
          RC=$?
          set -e
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -eq 0 ]; then echo "result=success" >> "$GITHUB_OUTPUT"; else echo "result=failure" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Report verifier and pricing checkpoint
        if: ${{ github.event_name == 'issue_comment' && steps.gate.outcome == 'success' }}
        uses: actions/github-script@v8
        env:
          COMMERCIAL_RESULT: ${{ steps.commercial.outputs.result }}
        with:
          script: |
            const fs=require('fs');
            let r={};
            try { r=JSON.parse(fs.readFileSync('ultra-deep-commercial-handoff.json','utf8')); } catch {}
            const runUrl=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body=[
              '🧪 Ultra Deep **VERIFIER + PRICE CHECKPOINT**',
              '',
              `Verified events: \`${r.verifier?.verified_count ?? 'n/a'}\``,
              `Verifier holds/noise: \`${r.verifier?.hold_count ?? 'n/a'}\``,
              `Competitor universe checked: \`${r.competitor_price_scan?.competitor_universe_count ?? 0}\``,
              `Exact competitor evidence: \`${r.competitor_price_scan?.evidence_count ?? 0}\``,
              `Commercial ready: \`${r.commercial?.ready_count ?? 'n/a'}\``,
              `Commercial hold: \`${r.commercial?.hold_count ?? 'n/a'}\``,
              `Result: \`${process.env.COMMERCIAL_RESULT || 'unknown'}\``,
              '',
              'Next: production SOT reconciliation → governed writes → exact storefront readback.',
              `Progress: ${runUrl}`
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});

      - name: Require commercial candidates before production
        id: commercial_gate
        if: ${{ steps.gate.outcome == 'success' }}
        shell: bash
        env:
          COMMERCIAL_EXIT_CODE: ${{ steps.commercial.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "$COMMERCIAL_EXIT_CODE" = "0"
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('ultra-deep-commercial-handoff.json','utf8'));
          if(!(r.verifier?.verified_count>0)) process.exit(1);
          if(!(r.commercial?.ready_count>0)) process.exit(1);
          if(r.production_writes!==0) process.exit(1);
          NODE

      - name: Probe compatible production executor
        id: endpoint
        if: ${{ steps.commercial_gate.outcome == 'success' }}
        shell: bash
        env:
          EXECUTOR_URL: https://kk-phone-rental.vercel.app/api/kk-admin-guard
        run: |
          set -euo pipefail
          COMPATIBLE=false
          if curl -fsS -X POST "$EXECUTOR_URL" -H "Content-Type: application/json" --data '{"action":"ultraDeepFullLoopHealth"}' -o executor-health.json; then
            node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('executor-health.json','utf8'));
          if(r.ok!==true)process.exit(1);
          if(r.service!=='kk-ultra-deep-full-loop')process.exit(1);
          if(String(r.runtime_version||'')!=='KK_ULTRA_DEEP_PRODUCTION_RUNTIME_V2')process.exit(1);
          if(String(r.completion_gate_version||'')!=='KK_ULTRA_DEEP_FULL_LOOP_COMPLETION_GATE_V2')process.exit(1);
          if(String(r.oidc_version||'')!=='KK_GITHUB_OIDC_VERIFIER_V1')process.exit(1);
          NODE
            COMPATIBLE=true
          fi
          echo "compatible=$COMPATIBLE" >> "$GITHUB_OUTPUT"
          echo "executor_commit_sha=$(node -e "try{const r=require('./executor-health.json');process.stdout.write(String(r.commit_sha||''))}catch{}")" >> "$GITHUB_OUTPUT"

      - name: Refresh production executor once when contract is stale
        if: ${{ steps.commercial_gate.outcome == 'success' && steps.endpoint.outputs.compatible != 'true' }}
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_uaeOdVIjXMSW690ZM2wPuJyt
          VERCEL_PROJECT_ID: prj_snbAmpya7YGmOuMbv1o8T16ouxl6
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          npm install --no-save vercel@latest >/dev/null
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tee ultra-deep-deploy-url.txt

      - name: Verify compatible production executor contract
        if: ${{ steps.commercial_gate.outcome == 'success' }}
        shell: bash
        env:
          EXECUTOR_URL: https://kk-phone-rental.vercel.app/api/kk-admin-guard
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -X POST "$EXECUTOR_URL" -H "Content-Type: application/json" --data '{"action":"ultraDeepFullLoopHealth"}' -o executor-health.json; then
              if node - <<'NODE'
          const r=require('./executor-health.json');
          if(r.ok!==true)process.exit(1);
          if(r.service!=='kk-ultra-deep-full-loop')process.exit(1);
          if(String(r.runtime_version||'')!=='KK_ULTRA_DEEP_PRODUCTION_RUNTIME_V2')process.exit(1);
          if(String(r.completion_gate_version||'')!=='KK_ULTRA_DEEP_FULL_LOOP_COMPLETION_GATE_V2')process.exit(1);
          if(String(r.oidc_version||'')!=='KK_GITHUB_OIDC_VERIFIER_V1')process.exit(1);
          NODE
              then ok=1; break; fi
            fi
            sleep 4
          done
          test "$ok" = 1

      - name: Execute governed production Full Loop
        id: production
        if: ${{ steps.commercial_gate.outcome == 'success' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.pin.outputs.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EXECUTOR_URL: https://kk-phone-rental.vercel.app/api/kk-admin-guard
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=kk-ultra-deep-production")"
          OIDC_TOKEN="$(printf '%s' "$OIDC_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value||''))")"
          test -n "$OIDC_TOKEN"
          node - <<'NODE'
          const fs=require('node:fs');
          const handoff=JSON.parse(fs.readFileSync('ultra-deep-commercial-handoff.json','utf8'));
          fs.writeFileSync('ultra-deep-production-request.json',JSON.stringify({
            action:'ultraDeepFullLoop',
            run_id:process.env.GITHUB_RUN_ID,
            head_sha:process.env.EXPECTED_SHA,
            event_name:process.env.EVENT_NAME,
            month:process.env.SCAN_MONTH,
            handoff
          }));
          NODE
          curl -fsS -X POST "$EXECUTOR_URL" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @ultra-deep-production-request.json \
            > ultra-deep-production-result.json
          node - <<'NODE'
          const r=require('./ultra-deep-production-result.json');
          if(r.ok!==true)process.exit(1);
          console.log(JSON.stringify(r.result));
          NODE

      - name: Require production COMPLETE
        id: production_gate
        if: ${{ steps.production.outcome == 'success' }}
        shell: bash
        env:
          PINNED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const Gate=require('./scripts/kk-ultra-deep-production-result-gate.js');
          const response=require('./ultra-deep-production-result.json');
          const commercial=require('./ultra-deep-commercial-handoff.json');
          const verdict=Gate.evaluate({
            response,
            commercial,
            expectedRunId:process.env.GITHUB_RUN_ID,
            expectedSha:process.env.PINNED_SHA
          });
          fs.writeFileSync('ultra-deep-production-acceptance-verdict.json',JSON.stringify(verdict,null,2));
          console.log(JSON.stringify(verdict));
          if(verdict.complete!==true)process.exit(1);
          NODE

      - name: Publish live progress summary
        if: always()
        shell: bash
        env:
          SCAN_RESULT: ${{ steps.scan.outputs.result }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          COMMERCIAL_RESULT: ${{ steps.commercial.outputs.result }}
          COMMERCIAL_GATE: ${{ steps.commercial_gate.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
          PRODUCTION_GATE: ${{ steps.production_gate.outcome }}
          PINNED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          {
            echo "### Ultra Deep Full Loop"
            echo "- month: $SCAN_MONTH"
            echo "- main: $PINNED_SHA"
            echo "- discovery: $SCAN_RESULT"
            echo "- discovery FULL gate: $GATE_OUTCOME"
            echo "- verifier/pricing: $COMMERCIAL_RESULT"
            echo "- commercial gate: $COMMERCIAL_GATE"
            echo "- production execution: $PRODUCTION_OUTCOME"
            echo "- production COMPLETE gate: $PRODUCTION_GATE"
            if [ -f ultra-deep-commercial-summary.json ]; then
              echo '~~~json'
              cat ultra-deep-commercial-summary.json
              echo '~~~'
            fi
            if [ -f ultra-deep-production-result.json ]; then
              echo '~~~json'
              cat ultra-deep-production-result.json
              echo '~~~'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full-loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultra-deep-full-loop-${{ github.run_id }}
          path: |
            ultra-deep-runtime-acceptance.json
            ultra-deep-runtime-summary.json
            ultra-deep-commercial-handoff.json
            ultra-deep-commercial-summary.json
            executor-health.json
            ultra-deep-production-result.json
            ultra-deep-production-acceptance-verdict.json
            ultra-deep-deploy-url.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Notify result in control issue
        if: ${{ always() && github.event_name == 'issue_comment' }}
        uses: actions/github-script@v8
        env:
          SCAN_RESULT: ${{ steps.scan.outputs.result }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          COMMERCIAL_GATE: ${{ steps.commercial_gate.outcome }}
          PRODUCTION_OUTCOME: ${{ steps.production.outcome }}
          PRODUCTION_GATE: ${{ steps.production_gate.outcome }}
        with:
          script: |
            const fs=require('fs');
            const runUrl=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let scan={},commercial={},prod={};
            try{scan=JSON.parse(fs.readFileSync('ultra-deep-runtime-acceptance.json','utf8'));}catch{}
            try{commercial=JSON.parse(fs.readFileSync('ultra-deep-commercial-handoff.json','utf8'));}catch{}
            try{prod=JSON.parse(fs.readFileSync('ultra-deep-production-result.json','utf8')).result||{};}catch{}
            const complete=process.env.PRODUCTION_GATE==='success';
            const partial=!complete&&process.env.PRODUCTION_OUTCOME==='success'&&Number(prod.production_writes||0)>0;
            const title=complete
              ? '🟢 Ultra Deep Full Loop **COMPLETE / PRODUCTION READBACK VERIFIED**'
              : (partial?'🟡 Ultra Deep Full Loop **PARTIAL SAFE EXECUTION / WRITES VERIFIED**':'🔴 Ultra Deep Full Loop **BLOCKED / FAIL-CLOSED**');
            const counts=prod.counts||{};
            const body=[
              `@${context.repo.owner}`,
              title,
              '',
              `Month: \`${process.env.SCAN_MONTH}\``,
              `Discovery candidates: \`${scan.candidate_count ?? 'n/a'}\``,
              `Verified events: \`${commercial.verifier?.verified_count ?? 'n/a'}\``,
              `Competitor price evidence: \`${commercial.competitor_price_scan?.evidence_count ?? 0}\``,
              `Created + readback: \`${counts.created_verified ?? 0}\``,
              `Updated + readback: \`${counts.updated_verified ?? 0}\``,
              `Auto-quarantined + readback: \`${counts.quarantined_verified ?? 0}\``,
              `No change: \`${counts.no_change ?? 0}\``,
              `Production writes: \`${prod.production_writes ?? 0}\``,
              `Blockers: \`${(prod.blockers||scan.blockers||[]).join(', ')||'none'}\``,
              '',
              `Run: ${runUrl}`
            ].join('\n');
            await github.rest.issues.createComment({owner:context.repo.owner,repo:context.repo.repo,issue_number:context.issue.number,body});
