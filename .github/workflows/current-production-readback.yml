name: Current Production Readback

on:
  workflow_call:

permissions:
  contents: read
  issues: read

jobs:
  verify:
    if: ${{ github.event.issue.number == 164 && startsWith(github.event.comment.body, '/verify-current-production ') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require owner and parse expected SHA
        id: authz
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          test "$ACTOR" = "mikesd1995"
          SHA="$(printf '%s' "$BODY" | awk '{print $2}')"
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'
          echo "expected_sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Verify current Production deployment metadata
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_SHA: ${{ steps.authz.outputs.expected_sha }}
          VERCEL_ORG_ID: team_uaeOdVIjXMSW690ZM2wPuJyt
          VERCEL_PROJECT_ID: prj_snbAmpya7YGmOuMbv1o8T16ouxl6
        run: |
          set -euo pipefail
          node - <<'NODE' > production-readback.json
          const token=process.env.VERCEL_TOKEN;
          if(!token) throw new Error('VERCEL_TOKEN_MISSING');
          const u=new URL('https://api.vercel.com/v6/deployments');
          u.searchParams.set('projectId',process.env.VERCEL_PROJECT_ID);
          u.searchParams.set('target','production');
          u.searchParams.set('limit','20');
          u.searchParams.set('teamId',process.env.VERCEL_ORG_ID);
          const res=await fetch(u,{headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
          if(!res.ok) throw new Error('PRODUCTION_LIST_HTTP_'+res.status);
          const list=(await res.json()).deployments||[];
          const d=list.find(x=>String(x.readyState||x.state||'').toUpperCase()==='READY');
          if(!d) throw new Error('NO_READY_PRODUCTION');
          const sha=String(d.meta&&d.meta.githubCommitSha||'');
          if(sha!==process.env.EXPECTED_SHA) throw new Error('PRODUCTION_SHA_MISMATCH_'+sha);
          process.stdout.write(JSON.stringify({id:String(d.id||d.uid||''),sha,state:String(d.readyState||d.state||''),url:String(d.url||'')},null,2));
          NODE
          cat production-readback.json

      - name: Verify public production routes
        shell: bash
        run: |
          set -euo pipefail
          PROD=https://kk-phone-rental.vercel.app
          OK=0
          for i in $(seq 1 12); do
            AUTH_STATUS="$(curl -sS -o auth.json -w '%{http_code}' "$PROD/api/kk-admin-auth" || true)"
            DASH_STATUS="$(curl -sS -o dashboard.json -w '%{http_code}' "$PROD/api/kk-rental-dashboard" || true)"
            HOME_STATUS="$(curl -sS -o home.html -w '%{http_code}' "$PROD/" || true)"
            if [ "$AUTH_STATUS" = "200" ] && [ "$DASH_STATUS" = "401" ] && [ "$HOME_STATUS" = "200" ]; then
              node -e "const fs=require('node:fs');const a=JSON.parse(fs.readFileSync('auth.json'));const d=JSON.parse(fs.readFileSync('dashboard.json'));if(!(a.ok===true&&a.authenticated===false&&d.ok===false&&d.error==='Unauthorized'))process.exit(1)"
              OK=1
              break
            fi
            sleep 3
          done
          test "$OK" = "1"

      - name: Record zero-write acceptance
        shell: bash
        run: |
          {
            echo '### Current Production Readback'
            echo '- deployment metadata: exact expected SHA, READY'
            echo '- storefront: HTTP 200'
            echo '- anonymous admin auth: expected unauthenticated contract'
            echo '- protected rental dashboard: expected HTTP 401 Unauthorized'
            echo '- business writes: 0'
            echo '- Google Sheet / Apps Script writes: 0'
          } >> "$GITHUB_STEP_SUMMARY"
