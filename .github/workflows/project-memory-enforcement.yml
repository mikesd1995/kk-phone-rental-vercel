name: Project Memory Enforcement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-memory-enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Syntax
        run: |
          node --check server/kk-project-memory.js
          node --check scripts/kk-project-memory-bootstrap.js
          node --check server/kk-agent-gateway.js
      - name: Project memory regressions
        run: node --test tests/kk-project-memory.test.js tests/kk-agent-gateway.test.js
      - name: Bootstrap proof
        run: |
          node scripts/kk-project-memory-bootstrap.js agent_orchestration project_memory > /tmp/kk-memory.json
          node -e "const r=require('/tmp/kk-memory.json'); if(r.status!=='READY'||!r.context.length||r.rules.business_truth_authority!==false) process.exit(1)"
