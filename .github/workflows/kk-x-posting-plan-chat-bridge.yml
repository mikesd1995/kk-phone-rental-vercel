name: KK X Posting Plan Agent

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

env:
  KK_PROJECT_MEMORY_GITHUB_OIDC_ENABLED: 'true'
  KK_AGENT_INVOCATION_GITHUB_OIDC_ENABLED: 'true'

concurrency:
  group: kk-x-posting-plan-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  x-posting-plan:
    if: startsWith(github.event.issue.title, '[KK-X-PLAN]') && github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Execute governed X posting-plan Agent
        id: bridge
        continue-on-error: true
        run: node scripts/kk-x-posting-plan-chat-bridge.js

      - name: Ensure evidence comment exists
        if: always()
        run: |
          if [ ! -s kk-x-posting-plan-bridge-comment.md ]; then
            printf '%s\n' '## KK X Posting Plan Agent' '' '- Status: **BLOCKED**' '- Blocker: `BRIDGE_RESULT_MISSING`' '' 'Owner review required. Auto-publish = false. Production writes = 0.' > kk-x-posting-plan-bridge-comment.md
          fi

      - name: Persist invocation evidence to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file kk-x-posting-plan-bridge-comment.md

      - name: Close bridge issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --reason completed

      - name: Enforce Agent PASS
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          if(!fs.existsSync('kk-x-posting-plan-bridge-result.json')) process.exit(1);
          const result=JSON.parse(fs.readFileSync('kk-x-posting-plan-bridge-result.json','utf8'));
          if(result.status!=='PASS' || result.gateway_status!=='RECORDED' || result.intent!=='x_posting_plan'){
            console.error(JSON.stringify({status:result.status,gateway_status:result.gateway_status,intent:result.intent,blocker:result.blocker||result.error_code||'UNKNOWN'}));
            process.exit(1);
          }
          if(result.production_writes!==0 || result.publishes!==0){
            console.error('Unexpected write authority');
            process.exit(1);
          }
          if(!result.project_memory || result.project_memory.status!=='READY' || result.project_memory.durable_mode!=='github_oidc' || Number(result.project_memory.durable_context_count||0)<1){
            console.error(JSON.stringify({project_memory:result.project_memory||null,blocker:'PROJECT_MEMORY_GITHUB_OIDC_ACCEPTANCE_FAILED'}));
            process.exit(1);
          }
          console.log(JSON.stringify({
            status:result.status,
            invocation_id:result.invocation&&result.invocation.invocation_id||'',
            timezone:result.plan&&result.plan.timezone||'',
            durable_memory_mode:result.project_memory&&result.project_memory.durable_mode||'',
            durable_memory_rows:result.project_memory&&result.project_memory.durable_context_count||0,
            slots:(result.plan&&result.plan.slots||[]).map(x=>x.time)
          }));
          NODE
