name: Admin Latency Observability Patcher

on:
  push:
    branches:
      - admin-latency-observability-v1-20260915
    paths:
      - .github/workflows/admin-latency-observability-patcher.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-latency-observability-v1-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact latency telemetry patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('api/kk-admin-guard.js')
          s=p.read_text(encoding='utf-8')
          def replace_exact(label, old, new):
              global s
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'{label} count={count}')
              s=s.replace(old,new,1)
          anchor="  return {events:checked.events,expected:checked.expected,latency_ms:Date.now()-startedAt};\n}\n\nmodule.exports=async function handler(req,res){\n  if(req.method!=='POST') return LegacyAdmin(req,res);\n"
          helper="  return {events:checked.events,expected:checked.expected,latency_ms:Date.now()-startedAt};\n}\n\nfunction instrumentLegacyTiming(res,meta){\n  const delegateStartedAt=Date.now();\n  const requestStartedAt=Number(meta&&meta.requestStartedAt)||delegateStartedAt;\n  const action=String(meta&&meta.action||'').slice(0,40);\n  const preflightMs=Number(meta&&meta.preflightMs);\n  const originalWriteHead=res&&res.writeHead;\n  const originalWrite=res&&res.write;\n  const originalEnd=res&&res.end;\n  let stamped=false;\n  function stamp(){\n    if(stamped) return;\n    stamped=true;\n    const now=Date.now();\n    const upstreamMs=Math.max(0,now-delegateStartedAt);\n    const totalMs=Math.max(0,now-requestStartedAt);\n    try{\n      if(action) res.setHeader('X-KK-Admin-Action',action);\n      if(Number.isFinite(preflightMs)&&preflightMs>=0) res.setHeader('X-KK-Admin-Preflight-MS',String(Math.round(preflightMs)));\n      res.setHeader('X-KK-Admin-Upstream-MS',String(upstreamMs));\n      res.setHeader('X-KK-Admin-Total-MS',String(totalMs));\n      const timing=[];\n      if(Number.isFinite(preflightMs)&&preflightMs>=0) timing.push('preflight;dur='+Math.round(preflightMs));\n      timing.push('upstream;dur='+upstreamMs);\n      timing.push('total;dur='+totalMs);\n      res.setHeader('Server-Timing',timing.join(', '));\n    }catch(_){}\n  }\n  if(typeof originalWriteHead==='function') res.writeHead=function(...args){ stamp(); return originalWriteHead.apply(this,args); };\n  if(typeof originalWrite==='function') res.write=function(...args){ stamp(); return originalWrite.apply(this,args); };\n  if(typeof originalEnd==='function') res.end=function(...args){ stamp(); return originalEnd.apply(this,args); };\n  return {started_at:delegateStartedAt,stamp};\n}\n\nmodule.exports=async function handler(req,res){\n  const requestStartedAt=Date.now();\n  if(req.method!=='POST') return LegacyAdmin(req,res);\n"
          replace_exact('handler anchor',anchor,helper)
          old="    if(prepared.publish_default_applied) res.setHeader('X-KK-Event-Publish-Default','TRUE');\n    res.setHeader('X-KK-Event-Guard','PASS');\n    return LegacyAdmin(clonedRequest(req,JSON.stringify(prepared.payload)),res);\n"
          new="    if(prepared.publish_default_applied) res.setHeader('X-KK-Event-Publish-Default','TRUE');\n    res.setHeader('X-KK-Event-Guard','PASS');\n    instrumentLegacyTiming(res,{requestStartedAt,action,preflightMs});\n    return LegacyAdmin(clonedRequest(req,JSON.stringify(prepared.payload)),res);\n"
          replace_exact('event delegate',old,new)
          old="  let snapshot;\n  try{\n    snapshot=await fetchFreshSnapshot({scriptUrl,apiKey,sheetId,sheetIdSource:envSheetId?'env':'default-fallback'},18000);\n  }catch(err){\n    return reply(res,503,{ok:false,error:'Booking preflight unavailable; write blocked: '+(err&&err.message?err.message:String(err)),error_code:'BOOKING_PREFLIGHT_UNAVAILABLE'});\n  }\n"
          new="  let snapshot;\n  const bookingPreflightStartedAt=Date.now();\n  let bookingPreflightMs=0;\n  try{\n    snapshot=await fetchFreshSnapshot({scriptUrl,apiKey,sheetId,sheetIdSource:envSheetId?'env':'default-fallback'},18000);\n    bookingPreflightMs=Date.now()-bookingPreflightStartedAt;\n    res.setHeader('X-KK-Booking-Preflight-MS',String(bookingPreflightMs));\n  }catch(err){\n    bookingPreflightMs=Date.now()-bookingPreflightStartedAt;\n    res.setHeader('X-KK-Booking-Preflight-MS',String(bookingPreflightMs));\n    return reply(res,503,{ok:false,error:'Booking preflight unavailable; write blocked: '+(err&&err.message?err.message:String(err)),error_code:'BOOKING_PREFLIGHT_UNAVAILABLE'});\n  }\n"
          replace_exact('booking preflight',old,new)
          old="  res.setHeader('X-KK-Booking-Guard','PASS');\n  res.setHeader('X-KK-Reservation-Mode',assessment.result.window&&assessment.result.window.mode||'none');\n  return LegacyAdmin(clonedRequest(req,raw),res);\n};\n"
          new="  res.setHeader('X-KK-Booking-Guard','PASS');\n  res.setHeader('X-KK-Reservation-Mode',assessment.result.window&&assessment.result.window.mode||'none');\n  instrumentLegacyTiming(res,{requestStartedAt,action,preflightMs:bookingPreflightMs});\n  return LegacyAdmin(clonedRequest(req,raw),res);\n};\n"
          replace_exact('booking delegate',old,new)
          old="module.exports._test={normalizedTemplateId,resolvePackageType,createProposal,updateProposal,evaluate,normalizeIdentityText,normalizeEventDate,bangkokTodayISO,isPastEventDate,findDuplicateEvent,prepareCreateEventPayload,parseCsv,eventRowsFromCsv,sourceEventCountFromCsv,validateLeanEventIndex};\n"
          new="module.exports._test={normalizedTemplateId,resolvePackageType,createProposal,updateProposal,evaluate,normalizeIdentityText,normalizeEventDate,bangkokTodayISO,isPastEventDate,findDuplicateEvent,prepareCreateEventPayload,parseCsv,eventRowsFromCsv,sourceEventCountFromCsv,validateLeanEventIndex,instrumentLegacyTiming};\n"
          replace_exact('test export',old,new)
          p.write_text(s,encoding='utf-8')
          test = "const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst path=require('node:path');\nconst guard=require('../api/kk-admin-guard.js');\nconst instrumentLegacyTiming=guard._test.instrumentLegacyTiming;\n\nfunction fakeResponse(){\n  const headers={};\n  return {headers,setHeader(k,v){headers[k]=String(v);},writeHead(){return this;},write(){return true;},end(){return this;}};\n}\n\ntest('delegate timing stamps segmented headers before response starts',()=>{\n  const realNow=Date.now; let now=1000; Date.now=()=>now;\n  try{\n    const res=fakeResponse();\n    instrumentLegacyTiming(res,{requestStartedAt:900,action:'createEvent',preflightMs:25});\n    now=1200; res.writeHead(200);\n    assert.equal(res.headers['X-KK-Admin-Action'],'createEvent');\n    assert.equal(res.headers['X-KK-Admin-Preflight-MS'],'25');\n    assert.equal(res.headers['X-KK-Admin-Upstream-MS'],'200');\n    assert.equal(res.headers['X-KK-Admin-Total-MS'],'300');\n    assert.equal(res.headers['Server-Timing'],'preflight;dur=25, upstream;dur=200, total;dur=300');\n  } finally { Date.now=realNow; }\n});\n\ntest('timing stamp is idempotent across writeHead/write/end',()=>{\n  const realNow=Date.now; let now=2000; Date.now=()=>now;\n  try{\n    const res=fakeResponse();\n    instrumentLegacyTiming(res,{requestStartedAt:1900,action:'createBooking',preflightMs:50});\n    now=2100; res.write('x'); now=2600; res.end();\n    assert.equal(res.headers['X-KK-Admin-Upstream-MS'],'100');\n    assert.equal(res.headers['X-KK-Admin-Total-MS'],'200');\n  } finally { Date.now=realNow; }\n});\n\ntest('guarded event and booking paths both install delegate telemetry',()=>{\n  const src=fs.readFileSync(path.join(__dirname,'..','api','kk-admin-guard.js'),'utf8');\n  const calls=[...src.matchAll(/instrumentLegacyTiming\\(res,\\{requestStartedAt,action,preflightMs(?::bookingPreflightMs)?\\}\\)/g)];\n  assert.equal(calls.length,2);\n  assert.match(src,/X-KK-Booking-Preflight-MS/);\n  assert.match(src,/X-KK-Admin-Upstream-MS/);\n  assert.match(src,/X-KK-Admin-Total-MS/);\n  assert.match(src,/Server-Timing/);\n});\n"
          Path('tests/admin-latency-observability.test.js').write_text(test,encoding='utf-8')
          doc = "# Admin Latency Observability v1 — 2026-09-15\n\n## Goal\nSegment guarded Admin write latency without changing booking/event business semantics or Apps Script.\n\n## Baseline from `15_Admin_Audit_Log`\nRecent bounded audit sample (`A750:J1000`):\n- `createEvent`: n=26, median 13.80s, p90 17.71s, max 24.66s.\n- `createBooking`: n=17, median 8.13s, p90 9.77s, max 11.63s.\n\nThese audit durations are useful historical operation timings but do not separate Vercel preflight from delegated upstream/write time or total guarded request time.\n\n## Change\nFor guarded `createEvent`, `createBooking`, and `updateBooking` responses, add non-sensitive timing headers immediately before the delegated response begins:\n- `X-KK-Admin-Action`\n- `X-KK-Admin-Preflight-MS`\n- `X-KK-Admin-Upstream-MS`\n- `X-KK-Admin-Total-MS`\n- `Server-Timing` with `preflight`, `upstream`, and `total`.\n\nBooking also gains `X-KK-Booking-Preflight-MS`. Existing Event preflight headers remain unchanged.\n\n## Safety\n- Timing only; no request/response business payload mutation.\n- No customer/event/booking identifiers are emitted by the new headers.\n- No Apps Script source/deploy.\n- No Sheet business-row mutation.\n- No Scanner/Verifier/Canary/Make change.\n- Existing collision/event guards remain authoritative.\n\n## Why this helps\nA real authorized Admin write can now show whether latency is dominated by guard preflight, the delegated Legacy Admin/Apps Script path, or total proxy time. This gives evidence for the later 9_5_9 lock-critical-section fix instead of guessing from end-to-end symptoms.\n"
          Path('docs/ADMIN_LATENCY_OBSERVABILITY_V1_2026-09-15.md').write_text(doc,encoding='utf-8')
          PY
      - name: Syntax check
        run: npm run check
      - name: Full regression
        run: npm test
      - name: Remove one-shot patcher and commit verified result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/admin-latency-observability-patcher.yml
          git add api/kk-admin-guard.js tests/admin-latency-observability.test.js docs/ADMIN_LATENCY_OBSERVABILITY_V1_2026-09-15.md
          git commit -m "Add guarded Admin latency telemetry"
          git push origin HEAD:admin-latency-observability-v1-20260915
