name: Ultra Deep V2 Acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ultra-deep-v2-acceptance.yml'
      - 'server/kk-ultra-deep-*.js'
      - 'server/kk-monthly-deep-scan-query-plan.js'
      - 'tests/kk-ultra-deep-*.test.js'
      - 'tests/kk-monthly-deep-scan-query-plan.test.js'
      - 'package.json'
jobs:
  v2-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: Focused V2 regression
        run: node --test tests/kk-ultra-deep-full-loop-v2.test.js tests/kk-ultra-deep-terminal-evidence.test.js tests/kk-ultra-deep-inventory-pipeline-v28.test.js tests/kk-monthly-deep-scan-query-plan.test.js tests/kk-ultra-deep-source-registry.test.js tests/kk-ultra-deep-runtime-runner.test.js
