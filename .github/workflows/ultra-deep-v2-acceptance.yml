name: Ultra Deep V2 Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/kk-ultra-deep-*.js'
      - 'tests/kk-ultra-deep-full-loop-v2.test.js'
      - 'tests/ultra-deep-v2-workflow-contract.test.js'
      - '.github/workflows/ultra-deep-v2-acceptance.yml'
      - 'package.json'

permissions:
  contents: read

# Cancel obsolete checks on the same PR; this saves included minutes once
# hosted runner access is restored. Never skip checks for the latest HEAD.
concurrency:
  group: kk-ultra-deep-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v2-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPROVED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Reject stale or synthetic merge checkout
        run: test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: Focused V2 and workflow safety regression
        run: node --test tests/kk-ultra-deep-full-loop-v2.test.js tests/ultra-deep-v2-workflow-contract.test.js
