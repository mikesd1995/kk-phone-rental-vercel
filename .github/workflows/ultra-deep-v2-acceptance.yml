name: Ultra Deep V2 Acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/kk-ultra-deep-*.js'
      - 'tests/kk-ultra-deep-full-loop-v2.test.js'
      - 'tests/kk-ultra-deep-production-runtime.test.js'
      - 'package.json'
jobs:
  v2-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Syntax gate
        run: npm run check
      - name: Focused V2 + production runtime regression
        run: node --test tests/kk-ultra-deep-full-loop-v2.test.js tests/kk-ultra-deep-production-runtime.test.js
