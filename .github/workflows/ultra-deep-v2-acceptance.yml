name: Ultra Deep V2 Acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/kk-ultra-deep-*.js'
      - 'tests/kk-ultra-deep-*.test.js'
      - 'tests/ultra-deep-panpuri-popup-reference.test.js'
      - 'scripts/kk-ultra-deep-*.js'
      - 'scripts/kk-ci-offline-dependency-gate.js'
      - 'tests/kk-ci-offline-dependency-gate.test.js'
      - 'tests/ultra-deep-v2-workflow-contract.test.js'
      - '.github/workflows/ultra-deep-v2-acceptance.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: kk-ultra-deep-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  v2-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPROVED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checked-out candidate SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          printf 'accepted_sha=%s\n' "$APPROVED_SHA"
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture source and runner preflight
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          node --version
          npm --version
          echo "This source tree intentionally has no npm lockfile."
          echo "No npm ci or network dependency install is run in this source-only gate."
          test ! -f package-lock.json && test ! -f npm-shrinkwrap.json
      - name: Prove zero-install dependency closure (fail closed)
        run: |
          node --test tests/kk-ci-offline-dependency-gate.test.js
          node scripts/kk-ci-offline-dependency-gate.js ultradeep
      - name: Syntax gate (source-only)
        run: npm run check
      - name: Ultra Deep October recall and owner-lineage regressions
        run: npm run test:ultradeep:recall
      - name: Focused V2 regression
        run: node --test tests/kk-ultra-deep-full-loop-v2.test.js
      - name: Workflow release-safety regression
        run: node --test tests/ultra-deep-v2-workflow-contract.test.js
