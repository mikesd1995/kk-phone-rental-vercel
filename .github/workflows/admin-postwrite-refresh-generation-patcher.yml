name: Admin Post-write Refresh Generation Hardening

on:
  push:
    branches:
      - admin-postwrite-refresh-lean-20260915
    paths:
      - .github/workflows/admin-postwrite-refresh-generation-patcher.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: admin-postwrite-refresh-lean-20260915
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Harden write-generation semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('admin/admin.js')
          s=p.read_text(encoding='utf-8')
          reps=[
            ('  let snapshotState = { stale: false, checkedAt: null, goodAt: null, health: null, error: "", writePending: false, writePendingReason: "" };',
             '  let snapshotState = { stale: false, checkedAt: null, goodAt: null, health: null, error: "", writePending: false, writePendingReason: "", writeGeneration: 0 };'),
            ('    state.loading=true;\n    const startedAt=Date.now();',
             '    state.loading=true;\n    const startedAt=Date.now();\n    const writeGenerationAtStart=Number(snapshotState.writeGeneration||0);'),
            ('      snapshotState.error="";\n      snapshotState.writePending=false;\n      snapshotState.writePendingReason="";\n      snapshotState.goodAt=snapshotState.checkedAt;',
             '      snapshotState.error="";\n      if(writeGenerationAtStart>=Number(snapshotState.writeGeneration||0)){\n        snapshotState.writePending=false;\n        snapshotState.writePendingReason="";\n      }\n      snapshotState.goodAt=snapshotState.checkedAt;'),
            ('  function schedulePostWriteRefresh(reason="write", attempt=0){\n    snapshotState.writePending=true;',
             '  function schedulePostWriteRefresh(reason="write", attempt=0){\n    if(attempt===0) snapshotState.writeGeneration=Number(snapshotState.writeGeneration||0)+1;\n    snapshotState.writePending=true;')
          ]
          for old,new in reps:
            count=s.count(old)
            if count!=1:
              raise SystemExit(f'expected exactly one source match, found {count}: {old[:120]}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          Path('tests/admin-postwrite-refresh-lean.test.js').write_text(r'''const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const src=fs.readFileSync(require('node:path').join(__dirname,'..','admin','admin.js'),'utf8');

          function createEventBlock(){
            const start=src.indexOf('const eventForm=$("#eventForm")');
            const end=src.indexOf('const resetCreateEventPrices=$("#resetCreateEventPrices")',start);
            assert.ok(start>=0 && end>start,'createEvent handler block must exist');
            return src.slice(start,end);
          }

          test('createEvent no longer blocks success UI on full snapshot refresh',()=>{
            const block=createEventBlock();
            assert.match(block,/const res=await api\("createEvent",p\)/);
            assert.match(block,/schedulePostWriteRefresh\("createEvent"\)/);
            assert.doesNotMatch(block,/await refresh\(\)/);
            assert.ok(block.indexOf('schedulePostWriteRefresh("createEvent")') < block.indexOf('showNotice("สร้างงานสำเร็จ"'));
          });

          test('post-write refresh is bounded, fail-visible, and keeps snapshot safety state',()=>{
            assert.match(src,/function schedulePostWriteRefresh\(reason="write", attempt=0\)/);
            assert.match(src,/if\(attempt<8\) return schedulePostWriteRefresh\(reason,attempt\+1\)/);
            assert.match(src,/snapshotState\.writePending=true/);
            assert.match(src,/Snapshot ยังไม่ Sync อัตโนมัติ กรุณากด Refresh/);
            assert.match(src,/Sync หน้าจอล่าสุดไม่สำเร็จ กรุณากด Refresh/);
          });

          test('refresh started before the latest write cannot clear pending state',()=>{
            assert.match(src,/writeGeneration:\s*0/);
            assert.match(src,/const writeGenerationAtStart=Number\(snapshotState\.writeGeneration\|\|0\)/);
            assert.match(src,/if\(attempt===0\) snapshotState\.writeGeneration=Number\(snapshotState\.writeGeneration\|\|0\)\+1/);
            assert.match(src,/if\(writeGenerationAtStart>=Number\(snapshotState\.writeGeneration\|\|0\)\)\{\s*snapshotState\.writePending=false;\s*snapshotState\.writePendingReason="";/);
          });

          test('verified refresh clears the pending marker and status exposes background convergence',()=>{
            assert.match(src,/snapshotState\.goodAt=snapshotState\.checkedAt/);
            assert.match(src,/กำลัง Sync Snapshot เบื้องหลัง/);
          });
          ''',encoding='utf-8')

          Path('docs/ADMIN_POSTWRITE_REFRESH_LEAN_2026-09-15.md').write_text('''# Admin Post-write Refresh Lean — 2026-09-15\n\n## Goal\nRelease the Create Event submit path immediately after the authoritative createEvent write returns, rather than waiting for a second full Admin snapshot before showing success and releasing the submit button.\n\n## Change\n- Create Event still performs the normal createEvent API write and all server-side guards.\n- After a successful write, the UI schedules the existing full snapshot refresh asynchronously instead of awaiting it inside the submit transaction.\n- Snapshot status shows a pending background-sync marker until a verified refresh succeeds.\n- Background refresh retries only while another refresh is already active, with a bounded retry count.\n- A monotonic write-generation token prevents an older in-flight refresh from clearing the pending marker for a newer write.\n- If background sync fails, the UI keeps the pending safety signal and tells the operator to press Refresh.\n\n## Safety boundary\n- Only Create Event post-write refresh behavior changes.\n- No Booking create/update path changes.\n- No Apps Script source or deployment changes.\n- No Google Sheet business-data mutation from this code change.\n- No Scanner/Verifier/Canary/Make changes.\n- Existing snapshot health validation remains authoritative; this change does not manufacture a successful snapshot.\n\n## Expected UX improvement\nThe Create Event button and success confirmation no longer wait for the second full snapshot after the write. The full snapshot still runs for eventual verified UI convergence, but outside the blocking submit path.\n\n## Acceptance\n- Exact source replacement count = 1 for every patch point.\n- Node syntax check passes.\n- Full repository test suite passes.\n- PR CI and Vercel Preview must pass before merge.\n- Post-merge Main CI and GitHub Vercel status must pass.\n- Browser-level authenticated acceptance is not claimed while the connected Vercel workspace scope remains unauthorized.\n''',encoding='utf-8')
          PY
      - name: Syntax check
        run: npm run check
      - name: Full regression
        run: npm test
      - name: Remove one-shot patcher and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/admin-postwrite-refresh-generation-patcher.yml
          git add admin/admin.js tests/admin-postwrite-refresh-lean.test.js docs/ADMIN_POSTWRITE_REFRESH_LEAN_2026-09-15.md
          git commit -m "Harden post-write refresh generation ordering"
          git push origin HEAD:admin-postwrite-refresh-lean-20260915
