name: Bounded OIDC Production Acceptance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_BOUNDED_OIDC_ACCEPTANCE'
        required: true
        type: string
      source_deployment_id:
        description: 'Optional exact deployment ID. If supplied, it must equal the auto-resolved current-main Production.'
        required: false
        type: string
  workflow_call:

permissions:
  contents: read

concurrency:
  group: kk-bounded-oidc-production-acceptance
  cancel-in-progress: false

jobs:
  bounded-oidc-acceptance:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 47 &&
          github.event.comment.user.login == github.repository_owner &&
          github.event.comment.author_association == 'OWNER' &&
          github.event.comment.body == '/run-bounded-oidc'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Require authorized trigger
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_CONFIRM: ${{ inputs.confirm }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            test "$MANUAL_CONFIRM" = "RUN_BOUNDED_OIDC_ACCEPTANCE"
            test "$GITHUB_REF" = "refs/heads/main"
          else
            test "$EVENT_NAME" = "issue_comment"
            test "$ISSUE_NUMBER" = "47"
            test "$COMMENT_LOGIN" = "$REPOSITORY_OWNER"
            test "$COMMENT_ASSOCIATION" = "OWNER"
            test "$COMMENT_BODY" = "/run-bounded-oidc"
          fi

      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Require authenticated Vercel transport
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN_MISSING"
            exit 1
          fi

      - name: Pin exact current main
        id: main_preflight
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "current_main=$CURRENT_MAIN" >> "$GITHUB_OUTPUT"
          test "$CHECKED_OUT_SHA" = "$CURRENT_MAIN"

      - name: Targeted OIDC regression tests
        run: |
          node --test tests/oidc-production-acceptance.test.js
          node --test tests/oidc-current-production-resolver.test.js
          node --test tests/oidc-zero-cost-dispatch.test.js

      - name: Resolve exact current-main READY Production
        id: source
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_SHA: ${{ steps.main_preflight.outputs.current_main }}
          MANUAL_SOURCE: ${{ inputs.source_deployment_id }}
        run: |
          set -euo pipefail
          node scripts/resolve-current-production.js             --expected-sha "$EXPECTED_SHA"             > oidc-source-deployment.json
          SOURCE_ID="$(node -e "const r=require('./oidc-source-deployment.json');process.stdout.write(r.deployment_id)")"
          test -n "$SOURCE_ID"
          if [ -n "${MANUAL_SOURCE:-}" ]; then
            test "$MANUAL_SOURCE" = "$SOURCE_ID"
          fi
          echo "deployment_id=$SOURCE_ID" >> "$GITHUB_OUTPUT"

      - name: Zero-write acceptance dry-run
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_SHA: ${{ steps.main_preflight.outputs.current_main }}
          SOURCE_ID: ${{ steps.source.outputs.deployment_id }}
        run: |
          set -euo pipefail
          node scripts/accept-oidc-production.js             --source-deployment "$SOURCE_ID"             --expected-sha "$EXPECTED_SHA"             --dry-run             > oidc-dry-run-report.json

      - name: Recheck main immediately before mutation
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.main_preflight.outputs.current_main }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$CURRENT_MAIN" = "$EXPECTED_SHA"

      - name: Run bounded OIDC acceptance
        id: acceptance
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_SHA: ${{ steps.main_preflight.outputs.current_main }}
          SOURCE_ID: ${{ steps.source.outputs.deployment_id }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 12m             node scripts/accept-oidc-production.js               --source-deployment "$SOURCE_ID"               --expected-sha "$EXPECTED_SHA"             > oidc-acceptance-report.json             2> oidc-acceptance.log

      - name: Enforce rollback recovery
        id: rollback
        if: ${{ always() && steps.source.outputs.deployment_id != '' && steps.main_preflight.outputs.current_main != '' }}
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_SHA: ${{ steps.main_preflight.outputs.current_main }}
          SOURCE_ID: ${{ steps.source.outputs.deployment_id }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m             node scripts/accept-oidc-production.js               --source-deployment "$SOURCE_ID"               --expected-sha "$EXPECTED_SHA"               --rollback-only             > oidc-rollback-report.json             2> oidc-rollback.log

      - name: Record final main head
        id: main_postflight
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "current_main=$CURRENT_MAIN" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$CURRENT_MAIN" > oidc-final-main-sha.txt

      - name: Upload secret-safe acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bounded-oidc-acceptance-${{ github.run_id }}
          path: |
            oidc-source-deployment.json
            oidc-dry-run-report.json
            oidc-acceptance-report.json
            oidc-acceptance.log
            oidc-rollback-report.json
            oidc-rollback.log
            oidc-final-main-sha.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Require terminal PASS_AND_ROLLED_BACK and safe recovery
        if: ${{ always() }}
        shell: bash
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          EXPECTED_SHA: ${{ steps.main_preflight.outputs.current_main }}
          FINAL_MAIN: ${{ steps.main_postflight.outputs.current_main }}
        run: |
          set -euo pipefail
          test "$ACCEPTANCE_OUTCOME" = "success"
          test "$ROLLBACK_OUTCOME" = "success"
          test "$FINAL_MAIN" = "$EXPECTED_SHA"
          node - <<'NODE'
          const fs=require('node:fs');
          const acceptance=JSON.parse(fs.readFileSync('oidc-acceptance-report.json','utf8'));
          const rollback=JSON.parse(fs.readFileSync('oidc-rollback-report.json','utf8'));
          if(acceptance.result!=='PASS_AND_ROLLED_BACK') process.exit(1);
          if(!['ROLLBACK_ALREADY_SAFE','ROLLBACK_PASS'].includes(rollback.result)) process.exit(1);
          if(acceptance.probe?.business_writes!==0) process.exit(1);
          if(acceptance.rollback?.oidc_probe_enabled!==false) process.exit(1);
          NODE
