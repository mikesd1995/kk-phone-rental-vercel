name: Bounded OIDC Production Acceptance

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RUN_BOUNDED_OIDC_ACCEPTANCE'
        required: true
        type: string
      source_deployment_id:
        description: 'Exact READY production deployment ID for current main'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: kk-bounded-oidc-production-acceptance
  cancel-in-progress: false

jobs:
  bounded-oidc-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Require explicit confirmation and main branch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm }}" = "RUN_BOUNDED_OIDC_ACCEPTANCE"
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout exact dispatch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require authenticated Vercel transport
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN_MISSING"
            exit 1
          fi

      - name: Require dispatch SHA is still current main
        id: main_preflight
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "current_main=$CURRENT_MAIN" >> "$GITHUB_OUTPUT"
          test "$CURRENT_MAIN" = "$GITHUB_SHA"

      - name: Targeted OIDC regression tests
        run: node --test tests/oidc-production-acceptance.test.js

      - name: Zero-write acceptance dry-run
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/accept-oidc-production.js             --source-deployment "${{ inputs.source_deployment_id }}"             --expected-sha "$GITHUB_SHA"             --dry-run             > oidc-dry-run-report.json

      - name: Recheck main immediately before mutation
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$CURRENT_MAIN" = "$GITHUB_SHA"

      - name: Run bounded OIDC acceptance
        id: acceptance
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 12m             node scripts/accept-oidc-production.js               --source-deployment "${{ inputs.source_deployment_id }}"               --expected-sha "$GITHUB_SHA"             > oidc-acceptance-report.json             2> oidc-acceptance.log

      - name: Enforce rollback recovery
        id: rollback
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 8m             node scripts/accept-oidc-production.js               --source-deployment "${{ inputs.source_deployment_id }}"               --expected-sha "$GITHUB_SHA"               --rollback-only             > oidc-rollback-report.json             2> oidc-rollback.log

      - name: Record final main head
        id: main_postflight
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "current_main=$CURRENT_MAIN" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$CURRENT_MAIN" > oidc-final-main-sha.txt

      - name: Upload secret-safe acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bounded-oidc-acceptance-${{ github.run_id }}
          path: |
            oidc-dry-run-report.json
            oidc-acceptance-report.json
            oidc-acceptance.log
            oidc-rollback-report.json
            oidc-rollback.log
            oidc-final-main-sha.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Require terminal acceptance and rollback success
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.acceptance.outcome }}" = "success"
          test "${{ steps.rollback.outcome }}" = "success"
          test "${{ steps.main_postflight.outputs.current_main }}" = "$GITHUB_SHA"
