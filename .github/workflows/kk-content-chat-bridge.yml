name: KK Content Chat Bridge

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  id-token: write

env:
  KK_PROJECT_MEMORY_GITHUB_OIDC_ENABLED: 'true'
  KK_AGENT_INVOCATION_GITHUB_OIDC_ENABLED: 'true'

concurrency:
  group: kk-content-chat-bridge-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  content-bridge:
    if: startsWith(github.event.issue.title, '[KK-CONTENT-RUN]') && github.event.issue.author_association == 'OWNER'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Execute mandatory content Agent pipeline
        id: bridge
        continue-on-error: true
        run: node scripts/kk-content-chat-bridge.js

      - name: Ensure bridge comment exists
        if: always()
        run: |
          if [ ! -s kk-content-bridge-comment.md ]; then
            printf '%s\n' '## KK Content Agent Bridge' '' '- Status: **BLOCKED**' '- Blocker: `BRIDGE_RESULT_MISSING`' '' 'Owner review required. Auto-publish = false. Production writes = 0.' > kk-content-bridge-comment.md
          fi

      - name: Persist invocation evidence to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$GH_REPO" --body-file kk-content-bridge-comment.md

      - name: Close bridge issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --reason completed

      - name: Enforce bridge PASS
        if: always()
        run: |
          node - <<'NODE'
          const fs=require('fs');
          if(!fs.existsSync('kk-content-bridge-result.json')) process.exit(1);
          const result=JSON.parse(fs.readFileSync('kk-content-bridge-result.json','utf8'));
          if(result.status!=='PASS'){
            console.error(JSON.stringify({status:result.status,blocker:result.blocker||result.error_code||'UNKNOWN'}));
            process.exit(1);
          }
          console.log(JSON.stringify({
            status:result.status,
            gateway_status:result.gateway_status,
            finalization_gate:result.finalization_gate,
            invocation_id:result.invocation&&result.invocation.invocation_id||'',
            winner_id:result.winner_id||''
          }));
          NODE
