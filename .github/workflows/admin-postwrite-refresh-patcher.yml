name: Admin Post-write Refresh Lean Patcher

on:
  push:
    branches:
      - admin-postwrite-refresh-lean-20260915
    paths:
      - .github/workflows/admin-postwrite-refresh-patcher.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: admin-postwrite-refresh-lean-20260915
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply exact bounded patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin/admin.js')
          src = path.read_text(encoding='utf-8')

          replacements = []
          replacements.append((
              '  let snapshotState = { stale: false, checkedAt: null, goodAt: null, health: null, error: "" };',
              '  let snapshotState = { stale: false, checkedAt: null, goodAt: null, health: null, error: "", writePending: false, writePendingReason: "" };'
          ))
          replacements.append((
              '      (h && h.warnings.length ? " | คำเตือน: "+h.warnings.join("; ") : "");',
              '      (h && h.warnings.length ? " | คำเตือน: "+h.warnings.join("; ") : "")+\n      (snapshotState.writePending ? " | บันทึกล่าสุดสำเร็จแล้ว · กำลัง Sync Snapshot เบื้องหลัง" : "");'
          ))
          replacements.append((
              '      snapshotState.stale=false;\n      snapshotState.error="";\n      snapshotState.goodAt=snapshotState.checkedAt;',
              '      snapshotState.stale=false;\n      snapshotState.error="";\n      snapshotState.writePending=false;\n      snapshotState.writePendingReason="";\n      snapshotState.goodAt=snapshotState.checkedAt;'
          ))
          replacements.append((
              '  async function uploadPosterFromInput(fileInput, form){',
              '''  let postWriteRefreshTimer=null;\n  function schedulePostWriteRefresh(reason="write", attempt=0){\n    snapshotState.writePending=true;\n    snapshotState.writePendingReason=String(reason||"write");\n    renderSnapshotStatus();\n    if(postWriteRefreshTimer) clearTimeout(postWriteRefreshTimer);\n    const delay=attempt===0 ? 120 : 500;\n    postWriteRefreshTimer=setTimeout(async()=>{\n      postWriteRefreshTimer=null;\n      if(state.loading){\n        if(attempt<8) return schedulePostWriteRefresh(reason,attempt+1);\n        snapshotState.error="บันทึกสำเร็จแล้ว แต่ Snapshot ยังไม่ Sync อัตโนมัติ กรุณากด Refresh";\n        renderSnapshotStatus();\n        return;\n      }\n      try{\n        await refresh();\n        updateUiLastRefresh();\n      }catch(err){\n        snapshotState.writePending=true;\n        snapshotState.writePendingReason=String(reason||"write");\n        snapshotState.error="บันทึกสำเร็จแล้ว แต่ Refresh เบื้องหลังไม่สำเร็จ: "+(err&&err.message?err.message:String(err));\n        renderSnapshotStatus();\n        showNotice("บันทึกสำเร็จแล้ว แต่ Sync หน้าจอล่าสุดไม่สำเร็จ กรุณากด Refresh","warn");\n      }\n    },delay);\n  }\n\n  async function uploadPosterFromInput(fileInput, form){'''
          ))
          replacements.append((
              '        resetCreateEventPriceOverrides();\n        await refresh();\n        const priceText=res.overrides_created ? ` · บันทึกราคาเฉพาะงาน ${res.overrides_created} แพ็กเกจ` : "";',
              '        resetCreateEventPriceOverrides();\n        schedulePostWriteRefresh("createEvent");\n        const priceText=res.overrides_created ? ` · บันทึกราคาเฉพาะงาน ${res.overrides_created} แพ็กเกจ` : "";'
          ))

          for old, new in replacements:
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:120]}')
              src = src.replace(old, new, 1)

          path.write_text(src, encoding='utf-8')

          test = Path('tests/admin-postwrite-refresh-lean.test.js')
          test.write_text(r'''const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const src=fs.readFileSync(require('node:path').join(__dirname,'..','admin','admin.js'),'utf8');

          function createEventBlock(){
            const start=src.indexOf('const eventForm=$("#eventForm")');
            const end=src.indexOf('const resetCreateEventPrices=$("#resetCreateEventPrices")',start);
            assert.ok(start>=0 && end>start,'createEvent handler block must exist');
            return src.slice(start,end);
          }

          test('createEvent no longer blocks success UI on full snapshot refresh',()=>{
            const block=createEventBlock();
            assert.match(block,/const res=await api\("createEvent",p\)/);
            assert.match(block,/schedulePostWriteRefresh\("createEvent"\)/);
            assert.doesNotMatch(block,/await refresh\(\)/);
            assert.ok(block.indexOf('schedulePostWriteRefresh("createEvent")') < block.indexOf('showNotice("สร้างงานสำเร็จ"'));
          });

          test('post-write refresh is bounded, fail-visible, and keeps snapshot safety state',()=>{
            assert.match(src,/function schedulePostWriteRefresh\(reason="write", attempt=0\)/);
            assert.match(src,/if\(attempt<8\) return schedulePostWriteRefresh\(reason,attempt\+1\)/);
            assert.match(src,/snapshotState\.writePending=true/);
            assert.match(src,/Snapshot ยังไม่ Sync อัตโนมัติ กรุณากด Refresh/);
            assert.match(src,/Sync หน้าจอล่าสุดไม่สำเร็จ กรุณากด Refresh/);
          });

          test('successful snapshot refresh clears pending-write marker',()=>{
            assert.match(src,/snapshotState\.writePending=false;\s*snapshotState\.writePendingReason="";\s*snapshotState\.goodAt=snapshotState\.checkedAt;/);
            assert.match(src,/กำลัง Sync Snapshot เบื้องหลัง/);
          });
          ''', encoding='utf-8')

          doc = Path('docs/ADMIN_POSTWRITE_REFRESH_LEAN_2026-09-15.md')
          doc.write_text('''# Admin Post-write Refresh Lean — 2026-09-15\n\n## Goal\nRelease the Create Event submit path immediately after the authoritative createEvent write returns, rather than waiting for a second full Admin snapshot before showing success and releasing the submit button.\n\n## Change\n- Create Event still performs the normal createEvent API write and all server-side guards.\n- After a successful write, the UI schedules the existing full snapshot refresh asynchronously instead of awaiting it inside the submit transaction.\n- Snapshot status shows a pending background-sync marker until a verified refresh succeeds.\n- Background refresh retries only while another refresh is already active, with a bounded retry count.\n- If background sync fails, the UI keeps the pending/stale safety signal and tells the operator to press Refresh.\n\n## Safety boundary\n- Only Create Event post-write refresh behavior changes.\n- No Booking create/update path changes.\n- No Apps Script source or deployment changes.\n- No Google Sheet business-data mutation from this code change.\n- No Scanner/Verifier/Canary/Make changes.\n- Existing snapshot health validation remains authoritative; this change does not manufacture a successful snapshot.\n\n## Expected UX improvement\nThe Create Event button and success confirmation no longer wait for the second full snapshot after the write. The full snapshot still runs for eventual verified UI convergence, but outside the blocking submit path.\n\n## Acceptance\n- Exact source replacement count = 1 for every patch point.\n- Node syntax check passes.\n- Full repository test suite passes.\n- PR CI and Vercel Preview must pass before merge.\n- Post-merge Main CI and GitHub Vercel status must pass.\n- Browser-level authenticated acceptance is not claimed while the connected Vercel workspace scope remains unauthorized.\n''', encoding='utf-8')
          PY

      - name: Syntax check
        run: npm run check

      - name: Full regression
        run: npm test

      - name: Remove one-shot patcher and commit verified result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/admin-postwrite-refresh-patcher.yml
          git add admin/admin.js tests/admin-postwrite-refresh-lean.test.js docs/ADMIN_POSTWRITE_REFRESH_LEAN_2026-09-15.md
          git commit -m "Lean Create Event post-write refresh path"
          git push origin HEAD:admin-postwrite-refresh-lean-20260915
