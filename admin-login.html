<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>KK Admin</title>
  <style>
    :root{color-scheme:light;--ink:#111827;--muted:#667085;--line:#d0d5dd;--blue:#2447bd;--bg:#f4f7fb}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}
    body:not(.ready) main{visibility:hidden}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}
    form{width:min(100%,380px);display:grid;gap:14px}
    .mark{width:56px;height:56px;margin:0 auto 8px;border-radius:16px;background:#fff;display:grid;place-items:center;font-weight:800;font-size:21px;box-shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.06)}
    label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    input,button{width:100%;min-height:56px;border-radius:14px;font:inherit;font-size:17px}
    input{border:1px solid var(--line);background:#fff;padding:0 16px;outline:none;text-align:center;letter-spacing:.12em}
    input:focus{border-color:#7f9cf5;box-shadow:0 0 0 4px rgba(36,71,189,.10)}
    button{border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #status{min-height:22px;margin:0;text-align:center;color:#b42318;font-size:14px}
  </style>
</head>
<body>
  <main>
    <form id="adminGate" novalidate>
      <div class="mark" aria-hidden="true">KK</div>
      <label for="pin">Admin PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Admin PIN" maxlength="64" required />
      <button id="submitBtn" type="submit">เข้าสู่ระบบ</button>
      <p id="status" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
  (()=>{
    const form=document.getElementById('adminGate');
    const pin=document.getElementById('pin');
    const btn=document.getElementById('submitBtn');
    const status=document.getElementById('status');
    const markAuthenticated=()=>sessionStorage.setItem('kk_admin_pin','__SESSION__');
    const clearLocalAuth=()=>sessionStorage.removeItem('kk_admin_pin');
    const enter=()=>{ markAuthenticated(); pin.value=''; location.replace('/admin/app'); };

    async function checkSession(){
      clearLocalAuth();
      try{
        const res=await fetch('/api/kk-admin-auth',{method:'GET',credentials:'same-origin',cache:'no-store'});
        const data=await res.json().catch(()=>({}));
        if(res.ok && data.authenticated) return enter();
      }catch(_){ }
      document.body.classList.add('ready');
      setTimeout(()=>pin.focus(),0);
    }

    form.addEventListener('submit',async ev=>{
      ev.preventDefault();
      const value=pin.value.trim();
      if(!value){ status.textContent='กรุณากรอก PIN'; pin.focus(); return; }
      btn.disabled=true;
      status.textContent='';
      try{
        const res=await fetch('/api/kk-admin-auth',{
          method:'POST',
          credentials:'same-origin',
          cache:'no-store',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({pin:value})
        });
        const data=await res.json().catch(()=>({}));
        if(res.ok && data.authenticated) return enter();
        clearLocalAuth();
        status.textContent=res.status===429 ? 'ลองใหม่ภายหลัง' : 'PIN ไม่ถูกต้อง';
        pin.select();
      }catch(_){
        clearLocalAuth();
        status.textContent='ไม่สามารถเข้าสู่ระบบได้';
      }finally{
        btn.disabled=false;
      }
    });

    checkSession();
  })();
  </script>
</body>
</html>
