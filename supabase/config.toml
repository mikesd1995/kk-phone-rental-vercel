[functions.kk-runtime-ledger-oidc-probe]
# The caller presents a Vercel OIDC JWT, not a Supabase Auth JWT.
# Supabase gateway verification must be disabled so the function can
# verify Vercel signature + exact production claims in handler code.
verify_jwt = false

[functions.kk-runtime-ledger-github-witness]
# GitHub Actions presents a GitHub OIDC JWT. The function performs custom
# issuer/JWKS/audience/repository/workflow/event verification in handler code.
verify_jwt = false


[functions.kk-admin-write-control]
# Vercel Production presents a Vercel OIDC JWT. The function performs exact
# issuer/audience/subject/team/project/environment verification in handler code.
verify_jwt = false
